<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercati e code</title>
<meta name="description" content="Chiusure giornaliere, volatilità e distribuzione dei rendimenti di indici e commodities">
<meta name="theme-color" content="#184f95">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mercati">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--surface:#fcfcfb;--surface2:#f1f0ec;--text:#0b0b0b;--text2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neg:#e34948;
  --up:#006300;--down:#d03b3b;--chip-bg:rgba(250,178,25,.24);--chip-text:#6b4a00;
  --accent:#184f95;--on-accent:#ffffff;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--surface2:#242422;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--neg:#e66767;
  --up:#0ca30c;--down:#e66767;--chip-bg:rgba(250,178,25,.18);--chip-text:#fab219;
  --accent:#6da7ec;--on-accent:#0d0d0d;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:20px;font-weight:500;margin:0}
h2{font-size:13px;font-weight:500;color:var(--text2);margin:20px 4px 6px}
h3{font-size:16px;font-weight:500;margin:0 0 2px}
p{margin:0}
button{font:inherit;color:inherit}
.testa{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 2px}
.meta{font-size:13px;color:var(--text2)}
.azioni{display:flex;gap:6px}
.btn{background:transparent;border:.5px solid var(--axis);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:36px}
.btn:active{transform:scale(.98)}
.avviso{background:var(--chip-bg);color:var(--chip-text);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.errore{background:rgba(227,73,72,.12);color:var(--down);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.lista{background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.riga{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border:0;border-bottom:.5px solid var(--border);text-align:left;cursor:pointer;min-height:56px}
.riga:last-child{border-bottom:0}
.riga:active{background:var(--surface2)}
.r-sx{flex:1;min-width:0;display:flex;flex-direction:column}
.r-nome{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-dx{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.r-prezzo{font-size:15px}
.su{color:var(--up)}.giu{color:var(--down)}
.spark{flex:0 0 64px;height:24px}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--chip-bg);color:var(--chip-text);border-radius:6px;padding:0 6px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.chip svg{width:10px;height:10px}
.indietro{background:none;border:0;color:var(--accent);padding:8px 0;font-size:15px;cursor:pointer;min-height:44px}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.hero .prezzo{font-size:28px;font-weight:500}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px 14px 12px;margin:12px 0}
.nota{font-size:13px;color:var(--text2);margin:2px 0 10px}
.piccolo{font-size:12px;color:var(--text2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.tile{background:var(--surface2);border-radius:8px;padding:8px 10px}
.tile .l{font-size:12px;color:var(--text2)}
.tile .v{font-size:20px;font-weight:500}
.tile .s{font-size:12px;color:var(--text2)}
.grafico{position:relative;width:100%}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text2);margin:6px 0}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.q{display:inline-block;width:10px;height:10px;border-radius:2px}
.lin{display:inline-block;width:16px;height:0;border-top:2px solid}
.lin.tr{border-top-style:dashed}
.seg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 10px;font-size:13px;color:var(--text2);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 0 0 .5px var(--border)}
.controlli{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--text2);text-align:right;padding:6px 4px;border-bottom:.5px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:6px 4px;border-bottom:.5px solid var(--border)}
tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin-top:8px}
.kv dt{color:var(--text2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--accent);padding:6px 0}
.sezione-testo p{font-size:14px;margin:0 0 10px}
.sezione-testo b{font-weight:500}
.vuoto{text-align:center;color:var(--text2);padding:48px 12px}
.azione{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:500;margin:12px 0;cursor:pointer;min-height:44px}
.cursore{display:grid;grid-template-columns:112px minmax(0,1fr) 64px;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.cursore label{color:var(--text2)}
.cursore output{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chip-btn{background:var(--surface2);border:0;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:32px}
.regola{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0 4px}
.piede{font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<main id="app"><p class="vuoto">Carico i dati…</p></main>
<script src="vendor/chart.umd.min.js"></script>
<script src="motore.js"></script>
<script>
"use strict";
const app = document.getElementById("app");
const stato = {dati: null, modo: "grezzi", scala: "lin", grafici: [], scrollElenco: 0};

window.addEventListener("error", e => mostraErrore(e.message || String(e)));
window.addEventListener("unhandledrejection", e => mostraErrore(String(e.reason && e.reason.message || e.reason)));
function mostraErrore(msg) {
  const d = document.createElement("div");
  d.className = "errore";
  d.textContent = "Errore: " + msg;
  app.prepend(d);
}

/* ---------- formattazione ---------- */
const MENO = "−";
const nf = (x, d) => Number(x).toLocaleString("it-IT", {minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always"});
function conSegno(x, d) {
  const s = nf(Math.abs(x), d);
  if (!/[1-9]/.test(s)) return s;                  /* niente "−0,0" */
  return (x > 0 ? "+" : MENO) + s;
}
const pct = (x, d = 2) => x == null ? "–" : conSegno(x * 100, d) + "%";
const pctNoSegno = (x, d = 2) => x == null ? "–" : nf(x * 100, d) + "%";
const volp = x => x == null ? "–" : nf(x, 1) + "%";
const sigma = z => z == null ? "–" : conSegno(z, 1) + "σ";
const sgm = v => (Number.isInteger(v) ? nf(v, 0) : nf(v, 2)) + "σ";
function decimaliPrezzo(p) { const a = Math.abs(p); return a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : 3; }
const prezzo = p => p == null ? "–" : nf(p, decimaliPrezzo(p));
const tickPrezzo = v => Number(v).toLocaleString("it-IT", {maximumFractionDigits: 3, useGrouping: "always"});
function dataIt(s, opz) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("it-IT", opz || {weekday: "short", day: "numeric", month: "short", year: "numeric"});
}
const dataBreve = s => dataIt(s, {day: "numeric", month: "short", year: "numeric"});
function rapporto(x) {
  if (!isFinite(x)) return "–";
  return "×" + (x < 10 ? nf(x, 1) : nf(Math.round(x), 0));
}
/* "una seduta ogni N": più leggibile delle percentuali piccolissime */
function ogni(p) {
  if (!(p > 0)) return "mai";
  const n = 1 / p;
  if (n < 10) return nf(n, 1);
  if (n < 1e4) return nf(Math.round(n), 0);
  if (n < 1e6) return nf(Math.round(n / 1e3), 0) + " mila";
  if (n < 1e9) return nf(n / 1e6, 1) + " mln";
  return nf(n / 1e9, 1) + " mld";
}
const potenzaDi10 = v => v > 0 && Math.abs(Math.log10(v) - Math.round(Math.log10(v))) < 1e-9;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* ---------- densità ---------- */
function lnGamma(z) {
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lnGamma(1 - z);
  z -= 1;
  let x = c[0];
  for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5;
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}
const normPdf = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
function tPdf(x, nu) {
  return Math.exp(lnGamma((nu + 1) / 2) - lnGamma(nu / 2) - 0.5 * Math.log(nu * Math.PI)
    - (nu + 1) / 2 * Math.log(1 + x * x / nu));
}
/* t con varianza unitaria, come nel GARCH */
function tStdPdf(x, nu) { const s = Math.sqrt((nu - 2) / nu); return tPdf(x / s, nu) / s; }

/* ---------- colori e Chart.js ---------- */
function colori() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return {text: v("--text"), text2: v("--text2"), muted: v("--muted"), grid: v("--grid"), axis: v("--axis"),
    surface: v("--surface"), s1: v("--s1"), s2: v("--s2"), s3: v("--s3"), neg: v("--neg")};
}
function alfa(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function impostaChart() {
  const c = colori();
  Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  Chart.defaults.font.size = 11;
  Chart.defaults.color = c.muted;
  Chart.defaults.animation = false;
  Chart.defaults.maintainAspectRatio = false;
  Chart.defaults.plugins.legend.display = false;
  Object.assign(Chart.defaults.plugins.tooltip, {backgroundColor: c.text, titleColor: c.surface, bodyColor: c.surface,
    padding: 8, cornerRadius: 6, displayColors: false, titleFont: {weight: "500"}});
  return c;
}
function assi(c, extra = {}) {
  const base = {grid: {color: c.grid, drawTicks: false}, border: {color: c.axis}, ticks: {padding: 6}};
  return {x: {...base, grid: {display: false}, ...extra.x}, y: {...base, ...extra.y}};
}
function nuovoGrafico(id, config) {
  const g = new Chart(document.getElementById(id), config);
  stato.grafici.push(g);
  return g;
}
function distruggi() { stato.grafici.forEach(g => g.destroy()); stato.grafici = []; }

/* etichette per gli assi temporali: un mese sì e uno no, l'anno sotto gennaio */
function tickMese(date) {
  return function (val, i) {
    const d = date[i];
    if (!d || i === 0 || i > date.length - 8 || date[i - 1].slice(0, 7) === d.slice(0, 7)) return "";
    const m = Number(d.slice(5, 7));
    if (m % 2 === 0) return "";
    const lab = dataIt(d, {month: "short"});
    return m === 1 ? [lab, d.slice(0, 4)] : lab;
  };
}

/* ---------- caricamento ---------- */
async function carica() {
  const r = await fetch("data.json", {cache: "no-store"});
  if (r.status === 404) throw new Error("NODATA");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function avvia() {
  try {
    stato.dati = await carica();
    rotta();
  } catch (e) {
    distruggi();
    app.innerHTML = e.message === "NODATA"
      ? `<p class="vuoto">I dati non sono ancora stati generati.<br>Avvia il workflow «Aggiorna dati» dalla scheda Actions del repository.</p>`
      : `<p class="vuoto">Non riesco a caricare i dati (${esc(e.message)}).<br><button class="btn" onclick="avvia()">Riprova</button></p>`;
  }
}

/* ---------- navigazione ---------- */
function rotta() {
  if (!stato.dati) return;
  const h = decodeURIComponent(location.hash.slice(1));
  distruggi();
  if (h.startsWith("m=")) dettaglio(h.slice(2));
  else if (h.startsWith("lab=")) laboratorio(h.slice(4));
  else if (h === "metodo") metodo();
  else if (h === "ricerca") ricerca();
  else elenco();
}
window.addEventListener("hashchange", () => {
  const h = location.hash;
  rotta();
  if (!h || h === "#") window.scrollTo(0, stato.scrollElenco); else window.scrollTo(0, 0);
});
function apri(sim) { stato.scrollElenco = window.scrollY; location.hash = "m=" + encodeURIComponent(sim); }
function indietro() { if (history.length > 1) history.back(); else location.hash = ""; }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => rotta());

/* ---------- elenco ---------- */
function sparkline(valori) {
  const v = valori.filter(x => x != null).slice(-60);
  if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), w = 64, h = 24, k = max - min || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 2 - (y - min) / k * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 64 24" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
const ICONA_ALLERTA = `<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9.5 9h-9z" fill="currentColor"/></svg>`;
function chipZ(z) {
  if (z == null || Math.abs(z) < 2) return "";
  return `<span class="chip" title="Movimento di ieri oltre 2σ">${ICONA_ALLERTA}${sigma(z)}</span>`;
}
function rigaAsset(a) {
  if (a.stato === "errore") {
    return `<button class="riga" disabled><span class="r-sx"><span class="r-nome">${esc(a.nome)}</span>
      <span class="r-sub">Dati non disponibili</span></span></button>`;
  }
  const u = a.ultimo, cl = u.var > 0 ? "su" : u.var < 0 ? "giu" : "";
  const volG = a.vol.garch_domani != null ? a.vol.garch_domani : a.vol.ewma;
  const vecchio = a.stato === "vecchio" ? `<span class="chip">dati del ${dataIt(u.data, {day: "numeric", month: "short"})}</span>` : "";
  return `<button class="riga" onclick="apri('${esc(a.simbolo)}')" aria-label="${esc(a.nome)}: ${prezzo(u.chiusura)}, ${pct(u.var)}">
    <span class="r-sx"><span class="r-nome">${esc(a.nome)}</span>
      <span class="r-sub">vol ${volp(volG)} · z ${sigma(u.z)} ${chipZ(u.z)}${vecchio}</span></span>
    ${sparkline(a.serie.chiusura)}
    <span class="r-dx"><span class="r-prezzo">${prezzo(u.chiusura)}</span><span class="${cl}" style="font-size:13px">${pct(u.var)}</span></span>
  </button>`;
}
function elenco() {
  const d = stato.dati;
  const date = d.asset.filter(a => a.ultimo).map(a => a.ultimo.data).sort();
  const ultima = date.length ? date[date.length - 1] : null;
  const gen = new Date(d.generato).toLocaleString("it-IT", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  const gruppi = [...new Set(d.asset.map(a => a.gruppo))];
  app.innerHTML = `
    <header class="testa"><div><h1>Mercati e code</h1>
      <p class="meta">${ultima ? "Chiusure fino a " + dataIt(ultima) : ""}<br>Aggiornato ${gen}</p></div>
      <div class="azioni"><button class="btn" onclick="location.hash='ricerca'">Ricerca</button>
      <button class="btn" onclick="location.hash='metodo'">Metodo</button>
      <button class="btn" onclick="avvia()" aria-label="Ricarica i dati">Ricarica</button></div></header>
    ${d.demo ? `<div class="avviso">Dati simulati per provare l'app. Al primo aggiornamento automatico arrivano le chiusure vere.</div>` : ""}
    ${gruppi.map(g => `<h2>${esc(g)}</h2><div class="lista">${d.asset.filter(a => a.gruppo === g).map(rigaAsset).join("")}</div>`).join("")}
    <p class="piede">Fonte: ${esc(d.fonte)}. La vol è la previsione GARCH annualizzata per la prossima seduta; z è il movimento dell'ultima seduta in deviazioni standard previste.</p>`;
}

/* ---------- dettaglio ---------- */
function dettaglio(sim) {
  const d = stato.dati, a = d.asset.find(x => x.simbolo === sim);
  if (!a || !a.ultimo) { location.hash = ""; return; }
  const u = a.ultimo, cl = u.var > 0 ? "su" : u.var < 0 ? "giu" : "";
  app.innerHTML = `
    <button class="indietro" onclick="indietro()">‹ Mercati</button>
    <h1>${esc(a.nome)}</h1>
    <p class="meta">${esc(a.simbolo)} · chiusura di ${dataIt(u.data)}</p>
    <div class="hero"><span class="prezzo">${prezzo(u.chiusura)}</span><span class="${cl}">${pct(u.var)}</span>
      <span class="piccolo">z ${sigma(u.z)}</span>${chipZ(u.z)}</div>
    ${a.stato === "vecchio" ? `<div class="avviso">Oggi il download non è riuscito: questi sono i dati dell'ultimo aggiornamento riuscito.</div>` : ""}
    ${a.storia ? `<button class="azione" onclick="location.hash='lab=' + encodeURIComponent('${esc(a.simbolo)}')">Simula strategie su questo mercato</button>` : ""}
    ${sezioneDomani(a)}
    ${sezioneVol(a)}
    ${sezioneCurva(a)}
    ${sezioneRinnovo(a)}
    ${sezioneDistribuzione(a)}
    ${sezioneZ(a)}
    ${sezionePrezzo(a)}
    <p class="piede">Fonte: ${esc(d.fonte)}. Campione dal ${dataBreve(a.distribuzione.dal)}, ${nf(a.distribuzione.n, 0)} sedute.
    ${a.rettifica ? `Serie rinnovata: rendimenti del contratto tenuto da un CFD Fineco. Fonte del rinnovo: ${esc(a.rettifica.fonte)}.`
      : a.gruppo !== "Indici azionari" ? "Serie del future più vicino senza rettifica per il cambio di contratto: i giorni di roll aggiungono salti che non sono rendimenti veri." : ""}</p>`;
  const c = impostaChart();
  graficoDomani(a, c);
  graficoVol(a, c);
  graficoCurva(a, c);
  graficoDistribuzione(a, c);
  graficoZ(a, c);
  graficoPrezzo(a, c);
}

function sezioneDomani(a) {
  const f = a.domani, q = f.t || f.n;
  const conT = !!f.t;
  return `<section class="card"><h3>La chiusura di domani</h3>
    <p class="nota">${conT
      ? `Distribuzione prevista dal GARCH per la prossima seduta, senza drift: t di Student con ν = ${nf(f.nu, 1)}.`
      : `Il GARCH non è stato stimato: distribuzione gaussiana con la σ EWMA, senza drift.`} σ giornaliera ${pctNoSegno(f.sigma)}.</p>
    <div class="legenda">${conT ? `<span><i class="lin" style="border-color:var(--s2)"></i>t di Student</span>` : ""}
      <span><i class="lin tr" style="border-color:var(--text2)"></i>Gaussiana</span>
      <span><i class="q" style="background:${conT ? "var(--s2)" : "var(--text2)"};opacity:.25"></i>90% centrale</span></div>

function graficoDomani(a, c) {
  const f = a.domani, P = f.prezzo, s = f.sigma, nu = f.nu, conT = !!f.t;
  const xs = [], dt = [], dn = [], area = [];
  const lo = conT ? Math.log(f.t["5"] / P) / s : -1.6449, hi = conT ? Math.log(f.t["95"] / P) / s : 1.6449;
  for (let i = 0; i <= 240; i++) {
    const x = -5 + i * 10 / 240, p = P * Math.exp(x * s);
    const jac = 1 / (s * p);
    const vt = conT ? tStdPdf(x, nu) * jac : null, vn = normPdf(x) * jac;
    xs.push(p);
    dt.push({x: p, y: vt});
    dn.push({x: p, y: vn});
    area.push({x: p, y: x >= lo && x <= hi ? (conT ? vt : vn) : null});
  }
  const ds = [
    {data: area, borderWidth: 0, pointRadius: 0, fill: "origin", backgroundColor: alfa(conT ? c.s2 : c.text2, 0.18), spanGaps: false},
    {data: dn, borderColor: c.text2, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0},
  ];
  if (conT) ds.push({data: dt, borderColor: c.s2, borderWidth: 2, pointRadius: 0});
  ds.push({data: [{x: P, y: 0}, {x: P, y: Math.max(...dn.map(p => p.y)) * 1.15}], borderColor: c.axis, borderWidth: 1, pointRadius: 0});
  nuovoGrafico("gDomani", {type: "line", data: {datasets: ds},
    options: {parsing: false, plugins: {tooltip: {enabled: false}},
      scales: assi(c, {x: {type: "linear", min: xs[0], max: xs[xs.length - 1], ticks: {callback: v => prezzo(v)},
          afterBuildTicks: ax => { ax.ticks = [P * Math.exp(lo * s), P, P * Math.exp(hi * s)].map(value => ({value})); }},
        y: {beginAtZero: true, ticks: {display: false}, grid: {display: false}}})}});
}

  const righe = [];
  for (const lato of ["sinistra", "destra"]) {
    blocco.code.forEach((cc, i) => {
      const oss = cc[lato], pOss = oss / n, pG = gc[String(cc.k)];
      const pT = blocco.code_t ? blocco.code_t[i][lato] : null;
      righe.push(`<tr><td>${lato === "sinistra" ? "Sotto " + MENO : "Sopra +"}${cc.k}σ</td><td>${ogni(pOss)}</td>

  }
  const hill = dist.hill, h = lato => {
    const v = hill[lato], vals = [v.q1, v.q25, v.q5].filter(x => x != null);
    if (v.q25 == null) return "–";
    return `${nf(v.q25, 1)} <span class="piccolo">(${nf(Math.min(...vals), 1)}–${nf(Math.max(...vals), 1)})</span>`;
  };
  const sottoQuattro = ["sinistra", "destra"].filter(l => hill[l].q25 != null && hill[l].q25 < 4);

  return `<section class="card"><h3>Distribuzione dei rendimenti giornalieri</h3>

      ${haGarch ? `<div class="seg" role="group" aria-label="Standardizzazione">

        <button aria-pressed="${modo === "garch"}" onclick="cambia('modo','garch')">Divisi per σ GARCH</button></div>` : ""}
      <div class="seg" role="group" aria-label="Scala verticale">
        <button aria-pressed="${stato.scala === "lin"}" onclick="cambia('scala','lin')">Lineare</button>

    </div>
    <div class="legenda"><span><i class="q" style="background:var(--s1);opacity:.55"></i>Osservati</span>
      <span><i class="lin tr" style="border-color:var(--text2)"></i>Gaussiana</span>
      <span><i class="lin" style="border-color:var(--s2)"></i>t di Student, ν ${nuTxt}</span></div>
    <div class="grafico" style="height:240px"><canvas id="gDist" role="img" aria-label="Istogramma dei rendimenti standardizzati con gaussiana e t di Student"></canvas></div>
    <p class="piccolo" style="margin-top:4px">${modo === "grezzi"
      ? `Rendimenti divisi per la deviazione standard di tutto il campione (${pctNoSegno(dist.dev_std)} al giorno).`
      : `Ogni rendimento diviso per la σ che il GARCH prevedeva quel giorno: resta la coda che il GARCH non spiega.`}
      ${fuori ? ` Oltre ±8σ, fuori dal grafico: ${nf(fuori, 0)} sedute.` : ""}</p>
    <h3 style="margin-top:14px;font-size:14px">Le code</h3>
    <table><thead><tr><th rowspan="2" style="vertical-align:bottom">Soglia</th><th colspan="3" style="text-align:center;border-bottom:0;padding-bottom:0">Una seduta ogni…</th><th rowspan="2" style="vertical-align:bottom">Volte</th></tr>
      <tr><th>osservata</th><th>t</th><th>gaussiana</th></tr></thead>
      <tbody>${righe.join("")}</tbody></table>
    <p class="piccolo" style="margin-top:6px">Quanto spesso il rendimento ha superato la soglia, contro quanto spesso dovrebbe con la t di Student e con la gaussiana. «Volte» è la frequenza osservata divisa per quella della gaussiana.</p>
    <dl class="kv" style="margin-top:12px">
      <dt>Indice di coda α (Hill), ribassi</dt><dd>${h("sinistra")}</dd>
      <dt>Indice di coda α (Hill), rialzi</dt><dd>${h("destra")}</dd>
      <dt>Asimmetria</dt><dd>${conSegno(dist.asimmetria, 2)}</dd>
      <dt>Curtosi in eccesso</dt><dd>${nf(dist.curtosi, 1)}</dd>
      <dt>VaR storico 1%, un giorno</dt><dd>${pctNoSegno(dist.var1)}</dd>

    <p class="piccolo" style="margin-top:8px">Il giorno più estremo del campione (${dataBreve(ms.data)}, ${pct(ms.rendimento)}) da solo vale il ${pctNoSegno(ms.quota, 0)} della somma dei rendimenti alla quarta, cioè della curtosi.</p>
    <details><summary>Tabella dell'istogramma</summary><table><thead><tr><th>Classe</th><th>Sedute</th></tr></thead><tbody>

function cambia(chiave, valore) {

function graficoDistribuzione(a, c) {
  const dist = a.distribuzione, modo = dist.garch ? stato.modo : "grezzi";
  const blocco = dist[modo], n = modo === "grezzi" ? dist.n : dist.garch.n;
  const bordi = stato.dati.bordi, larg = bordi[1] - bordi[0], log = stato.scala === "log";
  const barre = blocco.conteggi.map((k, i) => ({x: (bordi[i] + bordi[i + 1]) / 2, y: k ? k / (n * larg) : (log ? null : 0), k}));
  const lim = log ? 8 : 5, gauss = [], tt = [];
  let pdfT;
  if (modo === "grezzi") { const t = dist.grezzi.t; pdfT = x => tPdf((x - t.loc) / t.scala, t.df) / t.scala; }
  else { pdfT = x => tStdPdf(x, dist.garch.nu); }
  for (let i = 0; i <= 320; i++) {
    const x = -lim + i * 2 * lim / 320;
    gauss.push({x, y: normPdf(x)});
    tt.push({x, y: pdfT(x)});
  }
  const ymin = 1e-5;
  const fmtLog = v => {
    const e = Math.round(Math.log10(v));
    if (Math.abs(Math.log10(v) - e) > 1e-9) return "";
    return e >= -2 ? nf(v, Math.max(0, -e)) : "10" + String(e).replace("-", "⁻").replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  };
  nuovoGrafico("gDist", {data: {datasets: [
      {type: "bar", label: "Osservati", data: barre, backgroundColor: alfa(c.s1, 0.55), barPercentage: 1, categoryPercentage: 0.88, borderRadius: 0},
      {type: "line", label: "Gaussiana", data: gauss, borderColor: c.text2, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0},
      {type: "line", label: "t di Student", data: tt, borderColor: c.s2, borderWidth: 2, pointRadius: 0},
    ]},
    options: {parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex === 0, callbacks: {
        title: it => { const x = it[0].raw.x; return `Tra ${conSegno(x - larg / 2, 2)} e ${conSegno(x + larg / 2, 2)}σ`; },
        label: it => `${nf(it.raw.k, 0)} sedute, ${pctNoSegno(it.raw.k / n, it.raw.k / n < 0.001 ? 3 : 2)}`}}},
      scales: assi(c, {x: {type: "linear", min: -lim, max: lim, ticks: {stepSize: 2, callback: v => v === 0 ? "0" : conSegno(v, 0) + "σ"}},
        y: log ? {type: "logarithmic", min: ymin, max: 1, ticks: {callback: fmtLog, autoSkip: false},
                  grid: {color: ctx => ctx.tick && potenzaDi10(ctx.tick.value) ? c.grid : "transparent", drawTicks: false}}
               : {beginAtZero: true, ticks: {maxTicksLimit: 5, callback: v => nf(v, 1)}}})}});
}

function sezioneZ(a) {

  const g = stato.dati.gaussiana_code["2"] * 2 * n;
  const ct = a.distribuzione.garch && a.distribuzione.garch.code_t;

/* ---------- laboratorio di strategie ---------- */
const PRESET = {
  "Contrarian con trailing": {strategia: "contrarian", ingresso: "shock", lato: "long", k: 2, S: 2, T: 2, G: 0, H: 0},
  "Contrarian classico": {strategia: "contrarian", ingresso: "shock", lato: "long", k: 2, S: 4, T: 0, G: 1, H: 10},
  "Trend following": {strategia: "trend", ingresso: "shock", lato: "entrambi", k: 2, S: 2, T: 3, G: 0, H: 0},
  "Trend su rottura": {strategia: "trend", ingresso: "rottura", Nr: 55, lato: "entrambi", k: 2, S: 2, T: 4, G: 0, H: 0},
  "Combinata": {strategia: "combinata", ingresso: "shock", lato: "entrambi", k: 2, S: 2, T: 3, G: 0, H: 0},
  /* dalla ricerca: l'unico esempio positivo in tutte le prove, con la σ usata nella ricerca */
  "Trend following solo short": {strategia: "trend", ingresso: "shock", lato: "short", k: 2, S: 2, T: 3, G: 0, H: 0, sigma: "ewma"},
};
/* Finanziamento Fineco dei CFD su materie prime tenuti oltre la giornata: Euribor 1 mese (circa 2,2%)
   + 2,95% annuo addebitato sui long; Euribor − 2,95% accreditato sugli short, cioè oggi un addebito
   dello 0,75%. */
stato.lab = {...PRESET["Contrarian con trailing"], sigma: "garch", periodo: "tutto", costo: 0.10, rischio: 1,
  N: 60, fase: "tutte", dirTrend: "tutte", indicatore: "forza", Nr: 55, finanz: 5.15, finanzShort: 0.75, capitale: 1000};
/* spread di andata e ritorno di partenza per mercato, in %: KID Fineco sul gas 19 € per lato su
   10.000 €; mark-up 0,10% per lato sul petrolio più lo spread del mercato */
const COSTO_DEFAULT = {"NG=F": 0.4, "TTF=F": 0.4, "CL=F": 0.25, "BZ=F": 0.25, "GC=F": 0.15, "SI=F": 0.2, "HG=F": 0.2};
/* lotti dei CFD Fineco: moltiplicatore = dollari per punto di prezzo */
const LOTTI_FINECO = {"NG=F": {nome: "CFD Gas naturale di Fineco", molt: 500},
  "CL=F": {nome: "CFD Petrolio di Fineco", molt: 50}, "BZ=F": {nome: "CFD Petrolio Brent di Fineco", molt: 50}};
const meseIt = m => /^\d{4}-\d{2}$/.test(m || "") ? dataIt(m + "-01", {month: "long", year: "numeric"}) : "–";
const finTesto = v => v < 0 ? `accredito ${nf(-v, 2)}%` : `${nf(v, 2)}%`;

const nomiFase = p => p.indicatore === "autocorrelazione"
  ? {laterale: "Ritorno alla media", intermedia: "Neutra", trend: "Persistenza"}
  : {laterale: "Laterale", intermedia: "Intermedia", trend: "Trend"};
stato.storie = {};
stato.labGrafici = null;
let timerLab = null;

function diagnosiFasi(st, p) {
  const base = {...p, fase: "tutte", dirTrend: "tutte"};
  const dc = perFase(simulaStrategia(st, {...base, strategia: "contrarian"}).ops);
  const dt = perFase(simulaStrategia(st, {...base, strategia: "trend"}).ops);
  const g = stato.labGrafici, MIN = 10, fasi = ["laterale", "intermedia", "trend"], NOMI_FASE = nomiFase(p);
  g.Fasi.data.labels = fasi.map(k => NOMI_FASE[k]);
  g.Fasi.$n = [dc, dt];
  g.Fasi.data.datasets[0].data = fasi.map(k => dc[k].media);
  g.Fasi.data.datasets[1].data = fasi.map(k => dt[k].media);
  g.Fasi.update("none");
  const cella = d => d.n ? `${conSegno(d.media, 2)}R <span class="piccolo">(${d.n})</span>` : "–";
  const righe = [...fasi.map(k => [NOMI_FASE[k], k]), ["A favore del trend", "favore"], ["Contro il trend", "contro"]];
  /* una differenza conta solo se supera due volte il suo errore standard */
  const confronto = k => {
    const a = dc[k], b = dt[k];
    if (a.n < MIN || b.n < MIN) return {ok: false, frase: `${NOMI_FASE[k]}: troppo poche operazioni per dirlo.`};
    const d = a.media - b.media, es = Math.sqrt(a.es ** 2 + b.es ** 2), vince = d > 0 ? "contrarian" : "trend";
    const valori = `${conSegno(a.media, 2)}R il contrarian, ${conSegno(b.media, 2)}R il trend`;
    if (Math.abs(d) <= 2 * es) return {ok: true, vince: null, frase: `${NOMI_FASE[k]}: ${valori}, ma la differenza sta dentro il rumore (±${nf(2 * es, 2)}R).`};
    return {ok: true, vince, frase: `${NOMI_FASE[k]}: meglio ${vince === "contrarian" ? "il contrarian" : "il trend following"} (${valori}).`};
  };
  const esiti = Object.fromEntries(fasi.map(k => [k, confronto(k)]));
  const frasi = fasi.map(k => esiti[k].frase);
  const abbastanza = esiti.laterale.ok && esiti.trend.ok;
  const separa = esiti.laterale.vince === "contrarian" && esiti.trend.vince === "trend";
  const misura = p.indicatore === "autocorrelazione" ? "l'autocorrelazione" : "la forza del trend";
  const conclusione = !abbastanza ? "Servono più operazioni per giudicare: abbassa la soglia di ingresso o allarga il periodo."
    : separa ? `Qui ${misura} separa le due strategie come ci si aspetta. Prova la Combinata e controlla che regga in tutte e due le metà del periodo.`
    : `Qui ${misura} non separa le due strategie in modo affidabile: questi dati non giustificano il cambio di strategia in base alla fase.`;
  document.getElementById("lab-fasi").innerHTML = `
    <table style="margin-top:8px"><thead><tr><th>Fase all'ingresso</th><th>Contrarian</th><th>Trend</th></tr></thead><tbody>
      ${righe.map(([nome, k]) => `<tr><td>${nome}</td><td>${cella(dc[k])}</td><td>${cella(dt[k])}</td></tr>`).join("")}
    </tbody></table>
    <p class="piccolo" style="margin-top:6px">Tra parentesi il numero di operazioni. «A favore» vuol dire che l'operazione va nella stessa direzione del prezzo nelle ultime ${p.N} sedute.</p>
    <div class="regola">${frasi.join(" ")} ${conclusione}</div>`;
}

function descriviRegole(p, rinnovo) {
  const verso = (lato, dir) => (lato === 1 ? "compra" : "vendi allo scoperto") + (p.ingresso === "rottura"
    ? ` alla chiusura ${dir === "giu" ? "sotto il minimo" : "sopra il massimo"} delle ${p.Nr} sedute precedenti`
    : ` alla chiusura di una seduta che ${dir === "giu" ? "scende" : "sale"} oltre ${sgm(p.k)}`);
  const ingressiDi = regola => {
    const v = [], cLong = regola === "contrarian" ? "giu" : "su", cShort = regola === "contrarian" ? "su" : "giu";
    if (p.lato === "curva") return `${verso(1, cLong)}, se la curva è in backwardation; ${verso(-1, cShort)}, se è in contango`;
    if (p.lato !== "short") v.push(verso(1, cLong));
    if (p.lato !== "long") v.push(verso(-1, cShort));
    return v.join("; ");
  };
  const maiuscola = t => t.charAt(0).toUpperCase() + t.slice(1);
  const ingressi = [];
  if (p.strategia === "combinata") {
    const nf_ = nomiFase(p), misura = p.indicatore === "autocorrelazione" ? "autocorrelazione" : "forza del trend";
    ingressi.push(`Nella fase «${nf_.laterale.toLowerCase()}» (${misura} sulle ultime ${p.N} sedute) ${ingressiDi("contrarian")}`);
    ingressi.push(`Nella fase «${nf_.trend.toLowerCase()}» ${ingressiDi("trend")}. Nella fase «${nf_.intermedia.toLowerCase()}» resta fuori`);
  } else {
    ingressi.push(maiuscola(ingressiDi(p.strategia)));
    if (p.fase !== "tutte") ingressi.push(`Solo nella fase «${nomiFase(p)[p.fase].toLowerCase()}», misurata sulle ultime ${p.N} sedute`);
  }
  if (p.dirTrend !== "tutte") ingressi.push(`Solo ${p.dirTrend === "favore" ? "a favore del" : "contro il"} trend delle ultime ${p.N} sedute`);
  if (p.lato === "curva") ingressi.push("La curva si legge alla chiusura dell'ingresso: contango se il secondo contratto costa più del primo, e allora il passaggio al contratto successivo paga chi è short; backwardation nel caso opposto");
  const uscite = [`se perdi ${sgm(p.S)} dall'ingresso`];
  if (p.T > 0) uscite.push(`se il prezzo torna indietro di ${sgm(p.T)} dal punto migliore`);
  if (p.G > 0) uscite.push(`se guadagni ${sgm(p.G)}`);
  if (p.H > 0) uscite.push(`dopo ${p.H} sedute`);
  return `${ingressi.join(". ")}. Esci alla chiusura ${uscite.join(", ").replace(/, ([^,]*)$/, " o $1")}. σ è quella prevista per la seduta dopo l'ingresso e resta fissa; 1R è la perdita allo stop iniziale. Costi: spread ${nf(p.costo, 2)}% per operazione${rinnovo ? ", pagato di nuovo a ogni scadenza del CFD se resti dentro" : ""}; finanziamento ${finTesto(p.finanz)} annuo sui long e ${finTesto(p.finanzShort)} sugli short, per ogni seduta tenuta.`;
}

const CURSORI = [
  {id: "k", label: "Ingresso oltre", min: 1, max: 4, step: 0.25, fmt: sgm, mostra: p => p.ingresso !== "rottura"},
  {id: "Nr", label: "Rottura di", min: 10, max: 250, step: 5, fmt: v => v + " sedute", mostra: p => p.ingresso === "rottura"},
  {id: "S", label: "Stop iniziale", min: 0.5, max: 6, step: 0.25, fmt: sgm},
  {id: "T", label: "Trailing stop", min: 0, max: 8, step: 0.25, fmt: v => v ? sgm(v) : "spento"},
  {id: "G", label: "Target", min: 0, max: 10, step: 0.25, fmt: v => v ? sgm(v) : "nessuno"},
  {id: "H", label: "Durata massima", min: 0, max: 120, step: 1, fmt: v => v ? v + " sedute" : "nessuna"},
  {id: "costo", label: "Spread per operazione", min: 0, max: 1, step: 0.05, fmt: v => nf(v, 2) + "%"},
  {id: "finanz", label: "Finanziamento long", min: 0, max: 10, step: 0.05, fmt: v => nf(v, 2) + "% annuo"},
  {id: "finanzShort", label: "Finanziamento short", min: -5, max: 10, step: 0.05, fmt: v => finTesto(v) + " annuo"},
  {id: "rischio", label: "Rischio sul capitale", min: 0.25, max: 3, step: 0.25, fmt: v => nf(v, 2) + "%"},
];
function seg(chiave, opzioni, etichetta) {
  return `<div class="seg" role="group" aria-label="${etichetta}">${opzioni.map(([v, t]) =>
    `<button aria-pressed="${stato.lab[chiave] === v}" onclick="impostaLab('${chiave}','${v}')">${t}</button>`).join("")}</div>`;
}
function impostaLab(chiave, valore) {
  stato.lab[chiave] = valore;

}
function presetLab(nome) {

  const y = window.scrollY; rotta(); window.scrollTo(0, y);
}
const CURSORI_FASE = [{id: "N", label: "Finestra della fase", min: 20, max: 250, step: 5, fmt: v => v + " sedute"}];
const CURSORI_OGGI = [{id: "capitale", label: "Capitale", min: 250, max: 10000, step: 250, fmt: v => nf(v, 0) + " €"}];
const rigaCursore = (c, p) => `<div class="cursore"><label for="c-${c.id}">${c.label}</label>
  <input type="range" id="c-${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${p[c.id]}" oninput="cursore('${c.id}', this.value)">
  <output id="o-${c.id}">${c.fmt(p[c.id])}</output></div>`;
function cursore(id, valore) {
  stato.lab[id] = Number(valore);
  const c = [...CURSORI, ...CURSORI_FASE, ...CURSORI_OGGI].find(x => x.id === id);
  document.getElementById("o-" + id).textContent = c.fmt(stato.lab[id]);

}

async function laboratorio(sim) {
  const a = stato.dati.asset.find(x => x.simbolo === sim);
  if (!a || !a.storia) { location.hash = ""; return; }
  const p = stato.lab;
  if (p.sigma === "garch" && a.garch == null) p.sigma = "ewma";
  if (stato.labMercato !== sim) { p.costo = COSTO_DEFAULT[sim] ?? 0.10; stato.labMercato = sim; }
  if (p.lato === "curva" && !a.rettifica) p.lato = "entrambi";      /* serve lo spread tra i contratti */
  stato.labAsset = a;
  app.innerHTML = `
    <button class="indietro" onclick="indietro()">‹ ${esc(a.nome)}</button>
    <h1>Laboratorio: ${esc(a.nome)}</h1>
    <p class="meta">Simulazione sulle chiusure giornaliere. Non è una previsione.</p>
    <section class="card">
      <p class="piccolo">Esempi da cui partire</p><div class="chips">${Object.keys(PRESET).map(n => `<button class="chip-btn" onclick="presetLab('${n}')">${n}</button>`).join("")}
        <button class="chip-btn" onclick="location.hash='ricerca'">Risultati della ricerca</button></div>
      <div class="controlli">
        ${seg("strategia", [["contrarian", "Contrarian"], ["trend", "Trend"], ["combinata", "Combinata"]], "Strategia")}
        ${seg("ingresso", [["shock", "Shock in σ"], ["rottura", "Rottura"]], "Ingresso")}
        ${seg("lato", [["long", "Long"], ["short", "Short"], ["entrambi", "Entrambi"], ...(a.rettifica ? [["curva", "Verso della curva"]] : [])], "Lato")}
        ${seg("sigma", a.garch ? [["garch", "σ GARCH"], ["ewma", "σ EWMA"]] : [["ewma", "σ EWMA"]], "Volatilità")}
        ${seg("periodo", [["tutto", "Tutto"], ["prima", "Prima metà"], ["seconda", "Seconda metà"]], "Periodo")}
      </div>
      ${CURSORI.filter(c => !c.mostra || c.mostra(p)).map(c => rigaCursore(c, p)).join("")}
      <h3 style="font-size:14px;margin-top:12px">Fasi di mercato</h3>

      <p class="piccolo">${p.indicatore === "autocorrelazione"
        ? `Autocorrelazione: varianza dei rendimenti a ${Q_VR} sedute contro quella giornaliera (variance ratio). Bassa vuol dire che i movimenti tendono a rientrare, alta che tendono a proseguire. Le soglie dividono in tre parti uguali una passeggiata casuale.`
        : `Forza del trend: quanto il prezzo si è mosso nelle ultime sedute rispetto a una passeggiata casuale con la stessa volatilità. Sotto ${nf(SOGLIA_LATERALE, 1)} la fase è laterale, oltre ${nf(SOGLIA_TREND, 0)} è di trend.`}</p>
      ${CURSORI_FASE.map(c => rigaCursore(c, p)).join("")}
      <div class="controlli">
        ${p.strategia === "combinata" ? "" : seg("fase", [["tutte", "Tutte"], ...["laterale", "intermedia", "trend"].map(k => [k, nomiFase(p)[k]])], "Fase")}
        ${seg("dirTrend", [["tutte", "Ogni direzione"], ["favore", "A favore del trend"], ["contro", "Contro"]], "Direzione rispetto al trend")}
      </div>
      <div class="regola" id="lab-regola"></div>

        <span><i class="q" style="background:var(--s1);opacity:.15"></i>90% centrale</span></div>

      <div class="grafico" style="height:180px;margin-top:6px"><canvas id="gFin" role="img" aria-label="Distribuzione del capitale finale nelle simulazioni"></canvas></div>
      <dl class="kv" id="lab-mc"></dl>
    </section>
    <p class="piede">Ingressi e uscite alle chiusure: lo stop scatta alla prima chiusura oltre il livello, quindi una perdita può superare 1R, come con un gap. Costi: lo spread a ogni ingresso e uscita e, sulle serie rinnovate (gas Henry Hub e WTI), di nuovo a ogni scadenza del CFD attraversata; il finanziamento per ogni seduta tenuta. Fineco chiude comunque una posizione multiday dopo 12 mesi: qui non succede. Con σ GARCH i parametri sono stimati su tutto lo storico, quindi gli ingressi usano un po' di informazione dal futuro; con σ EWMA no. Il Monte Carlo rimescola le operazioni passate come se fossero indipendenti: non può produrre una perdita peggiore della peggiore già vista e sottostima le serie di perdite consecutive.</p>`;
  document.getElementById("lab-regola").textContent = descriviRegole(p, !!a.rettifica);
  let st = stato.storie[a.storia];
  if (!st) {
    document.getElementById("lab-avvisi").innerHTML = `<p class="vuoto" style="padding:16px">Carico lo storico…</p>`;
    try {
      const r = await fetch(a.storia, {cache: "no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      st = stato.storie[a.storia] = await r.json();
    } catch (e) {
      document.getElementById("lab-avvisi").innerHTML = `<div class="errore">Lo storico di questo mercato oggi non è disponibile (${esc(e.message)}).</div>`;
      return;

  }
  stato.labStoria = st;
  creaGraficiLab();
  ricalcolaLab();
}

        y: {ticks: {maxTicksLimit: 5, callback: v => conSegno(v, 0) + "R"}}})}});
  const banda = (alfaF, riemp) => ({data: [], borderWidth: 0, pointRadius: 0, fill: riemp, backgroundColor: alfa(c.s1, alfaF)});
  g.Fan = nuovoGrafico("gFan", {type: "line", data: {labels: Array.from({length: 201}, (_, i) => i), datasets: [
      banda(0, false), banda(0.15, "-1"), banda(0, false), banda(0.35, "-1"),
      {data: [], borderColor: c.s1, borderWidth: 2, pointRadius: 0},
      {data: Array(201).fill(100), borderColor: c.text2, borderDash: [4, 4], borderWidth: 1, pointRadius: 0}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex === 4, callbacks: {title: it => `Dopo ${it[0].label} operazioni`,
        label: it => { const b = g.Fan.$bande, i = it.dataIndex; return [`mediana ${nf(b.p50[i] - 100, 1)}%`, `90% tra ${nf(b.p5[i] - 100, 1)}% e ${nf(b.p95[i] - 100, 1)}%`]; }}}},
      scales: assi(c, {x: {title: {display: true, text: "operazioni", color: c.muted, font: {size: 11}}, ticks: {autoSkip: false, maxRotation: 0, callback: v => v % 50 === 0 ? String(v) : ""}},
        y: {ticks: {maxTicksLimit: 6, callback: v => conSegno(v - 100, 0) + "%"}}})}});
  g.Fin = nuovoGrafico("gFin", {data: {datasets: [
      {type: "bar", data: [], backgroundColor: [], barPercentage: 1, categoryPercentage: 0.88}]},
    options: {parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
      plugins: {tooltip: {callbacks: {title: it => `Tra ${conSegno(it[0].raw.da, 0)}% e ${conSegno(it[0].raw.a, 0)}%`,
        label: it => `${pctNoSegno(it.raw.y / 4000, 1)} delle simulazioni`}}},
      scales: assi(c, {x: {type: "linear", ticks: {maxTicksLimit: 6, callback: v => conSegno(v, 0) + "%"}},
        y: {beginAtZero: true, ticks: {display: false}, grid: {display: false}}})}});
  g.Fasi = nuovoGrafico("gFasi", {type: "bar", data: {labels: ["Laterale", "Intermedia", "Trend"], datasets: [
      {label: "Contrarian", data: [], backgroundColor: c.s2, barPercentage: 0.9, categoryPercentage: 0.7},
      {label: "Trend following", data: [], backgroundColor: c.s1, barPercentage: 0.9, categoryPercentage: 0.7}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {callbacks: {title: it => it[0].label, label: it => {
        const d = g.Fasi.$n[it.datasetIndex][["laterale", "intermedia", "trend"][it.dataIndex]];
        return d.n ? `${it.dataset.label}: ${conSegno(d.media, 2)}R su ${d.n} operazioni` : `${it.dataset.label}: nessuna operazione`; }}}},
      scales: assi(c, {y: {ticks: {maxTicksLimit: 5, callback: v => conSegno(v, 2) + "R"}}})}});
  g.colori = c;
  stato.labGrafici = g;
}

function aggiornaOggi(res, st, a) {
  const p = stato.lab, el = document.getElementById("lab-oggi");
  if (!el || !a) return;
  const n = st.c.length, P = st.c[n - 1], oggi = dataBreve(st.date[n - 1]);
  if (res.i1 !== n - 1) { el.innerHTML = `<p class="piccolo">Scegli «Tutto» o «Seconda metà» per vedere la situazione di oggi.</p>`; return; }
  const ult = res.ops.length ? res.ops[res.ops.length - 1] : null;
  let html = "", sigma = null;
  if (ult && ult.motivo === "aperta") {
    sigma = ult.se;
    html += `<p class="nota">Posizione ${ult.lato === 1 ? "long" : "short"} aperta dal ${dataBreve(st.date[ult.ie])} a ${prezzo(st.c[ult.ie])}${st.rinnovo ? ", prezzo riportato al contratto di oggi" : ""}${ult.rinnovi ? `, rinnovata ${ult.rinnovi} ${ult.rinnovi === 1 ? "volta" : "volte"} a scadenza` : ""}. Se non eri dentro dall'inizio, aspetta il prossimo ingresso: lo stop e la dimensione sono stati fissati con la σ di quel giorno.</p>
      <dl class="kv"><dt>Chiusura del ${oggi}</dt><dd>${prezzo(P)}</dd>
      <dt>Esci se una chiusura va ${ult.lato === 1 ? "sotto" : "sopra"}</dt><dd>${prezzo(ult.livello)}</dd>
      ${ult.target ? `<dt>Target</dt><dd>${prezzo(ult.target)}</dd>` : ""}
      ${ult.restanti != null ? `<dt>Sedute rimaste</dt><dd>${ult.restanti}</dd>` : ""}
      <dt>Risultato finora</dt><dd>${conSegno(ult.R, 2)}R</dd></dl>`;
    const z = res.daZero;
    if (z && z.regola && (z.long || z.short)) {
      const righe = [];
      if (z.long) righe.push(`<dt>Long se la prossima chiusura è ${z.long.sopra ? "sopra" : "sotto"}</dt><dd>${prezzo(z.long.prezzo)}</dd>`);
      if (z.short) righe.push(`<dt>Short se la prossima chiusura è ${z.short.sopra ? "sopra" : "sotto"}</dt><dd>${prezzo(z.short.prezzo)}</dd>`);
      html += `<p class="nota" style="margin-top:10px">Se parti oggi senza posizione:</p><dl class="kv">${righe.join("")}</dl>`;
    }
  } else if (res.prossima) {
    const q = res.prossima;
    sigma = q.sigma || null;
    if (!q.regola) {
      html += `<p class="nota">Nessuna posizione aperta. Con la fase di oggi (${q.fase ? nomiFase(p)[q.fase].toLowerCase() : "non calcolabile"}) la regola resta ferma.</p>`;
    } else {
      const righe = [];
      if (q.long) righe.push(`<dt>Long se la prossima chiusura è ${q.long.sopra ? "sopra" : "sotto"}</dt><dd>${prezzo(q.long.prezzo)}</dd>`);
      if (q.short) righe.push(`<dt>Short se la prossima chiusura è ${q.short.sopra ? "sopra" : "sotto"}</dt><dd>${prezzo(q.short.prezzo)}</dd>`);
      html += `<p class="nota">Nessuna posizione aperta. Chiusura del ${oggi}: ${prezzo(P)}.</p>` +
        (righe.length ? `<dl class="kv">${righe.join("")}</dl>` : `<p class="piccolo">Con i filtri scelti la prossima seduta non può dare un ingresso.</p>`);
    }
  }
  /* dimensione per un ingresso da oggi: σ di oggi, non quella di una posizione aperta da tempo */
  if (res.daZero && res.daZero.sigma) sigma = res.daZero.sigma;
  if (sigma) {
    const rischio = p.capitale * p.rischio / 100, stopPct = p.S * sigma, ctrv = rischio / stopPct;
    html += `<h3 style="font-size:14px;margin-top:12px">Quanto puoi muovere${ult && ult.motivo === "aperta" ? " con un ingresso da oggi" : ""}</h3>
      <dl class="kv"><dt>Rischio per operazione</dt><dd>${nf(rischio, 2)} €</dd>
      <dt>Stop a ${sgm(p.S)}, cioè</dt><dd>${pctNoSegno(stopPct, 1)} dal prezzo</dd>
      <dt>Controvalore massimo</dt><dd>${nf(ctrv, 0)} €</dd></dl>`;
    const lotto = LOTTI_FINECO[a.simbolo];
    if (lotto) {
      const cambio = stato.dati.cambio && stato.dati.cambio.EURUSD;
      const valLotto = lotto.molt * P / (cambio || 1), rischioLotto = valLotto * stopPct, troppo = valLotto > ctrv * 1.05;
      html += `<div class="${troppo ? "avviso" : "regola"}">Un lotto del ${lotto.nome} vale ${lotto.molt} volte il prezzo in dollari: circa ${nf(valLotto, 0)} € di controvalore${cambio ? ` al cambio di ${nf(cambio, 4)}` : ""}. Con questo stop rischia ${nf(rischioLotto, 0)} €, cioè il ${pctNoSegno(rischioLotto / p.capitale, 1)} del capitale: ${troppo ? "troppo per il rischio che hai scelto." : "rientra nel rischio che hai scelto."}</div>`;
    }
  }
  const rt = a.rettifica;
  if (rt && rt.prossimo_roll) html += `<p class="piccolo" style="margin-top:8px">Il CFD sul contratto di ${meseIt(rt.prossimo_roll.consegna)} si chiude d'ufficio il ${dataBreve(rt.prossimo_roll.data)}: chi è dentro deve riaprire sul contratto successivo e paga di nuovo lo spread.</p>`;
  if (a.curva) html += `<p class="piccolo" style="margin-top:8px">Curva dei futures: ${a.curva.struttura}, quindi il passaggio al contratto successivo ${a.curva.struttura === "contango" ? "favorisce chi è short" : "favorisce chi è long"}: il secondo contratto costa ${pct(a.curva.spread12, 1)} rispetto al primo. Su tutta la curva, ${a.curva.mesi_pendenza} mesi, il roll vale in media ${pct(a.curva.roll_annuo, 1)} l'anno per chi è long e lo stesso con il segno opposto per chi è short.</p>`;
  el.innerHTML = html;
}

function ricalcolaLab() {
  const st = stato.labStoria, g = stato.labGrafici, p = stato.lab;
  if (!st || !g || !document.getElementById("gR")) return;
  const c = g.colori;
  document.getElementById("lab-regola").textContent = descriviRegole(p, !!(stato.labAsset && stato.labAsset.rettifica));
  const ris = simulaStrategia(st, p), {ops, i0, i1, anni} = ris;
  aggiornaOggi(ris, st, stato.labAsset);
  const s = statisticheOps(ops, anni);
  diagnosiFasi(st, p);
  document.getElementById("lab-periodo").textContent =
    `Dal ${dataBreve(st.date[i0])} al ${dataBreve(st.date[i1])}, ${nf(i1 - i0 + 1, 0)} sedute.`;
  const avvisi = [];
  if (!s) avvisi.push(`<div class="avviso">Nessuna operazione con queste regole. Abbassa la soglia di ingresso.</div>`);
  else if (s.n < 30) avvisi.push(`<div class="avviso">Solo ${s.n} operazioni: troppo poche per giudicare. Abbassa la soglia di ingresso o usa tutto il periodo.</div>`);
  document.getElementById("lab-avvisi").innerHTML = avvisi.join("");
  const tile = (l, v, sub) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  if (!s) {
    document.getElementById("lab-tiles").innerHTML = "";
    document.getElementById("lab-ops").innerHTML = "";
    document.getElementById("lab-mc").innerHTML = "";
    document.getElementById("lab-mc-nota").textContent = "";
    [g.R, g.Eq, g.Fan, g.Fin].forEach(ch => { ch.data.datasets.forEach((d, i) => { if (!(ch === g.Fan && i === 5)) d.data = []; }); ch.update("none"); });
    return;
  }
  document.getElementById("lab-tiles").innerHTML =
    tile("Operazioni", nf(s.n, 0), s.perAnno != null ? `${nf(s.perAnno, 1)} l'anno` : "") +
    tile("Vincenti", pctNoSegno(s.vincenti, 0), `media ${conSegno(s.mediaV, 2)}R / ${conSegno(s.mediaP, 2)}R`) +
    tile("Media per operazione", conSegno(s.media, 2) + "R", `${pct(s.mediaPct)} del prezzo`) +
    tile("Profit factor", isFinite(s.pf) ? nf(s.pf, 2) : "–", "guadagni / perdite") +
    tile("Peggiore / migliore", `${conSegno(s.peggiore, 1)}R`, `migliore ${conSegno(s.migliore, 1)}R`) +
    tile("Asimmetria", s.skew != null ? conSegno(s.skew, 2) : "–", s.skew == null ? "" : s.skew < 0 ? "coda sinistra: corto sulle code" : "coda destra: lungo sulle code") +
    tile("Durata media", nf(s.durata, 1) + " sedute") +
    tile("Discesa massima", `${conSegno(-s.ddR, 1)}R`, "sul cumulato storico");
  /* istogramma dei risultati */
  const R = ops.map(o => o.R), bin = classi(R, [0.1, 0.2, 0.25, 0.5, 1, 2, 5]);
  g.R.data.datasets[0].data = bin;
  g.R.data.datasets[0].backgroundColor = bin.map(b => alfa(b.x >= 0 ? c.s1 : c.neg, 0.85));
  g.R.data.datasets[1].data = [{x: s.media, y: 0}, {x: s.media, y: Math.max(...bin.map(b => b.y)) * 1.08}];
  g.R.update("none");
  /* cumulato */
  g.Eq.data.labels = ops.map(o => dataBreve(st.date[o.iu]));
  g.Eq.data.datasets[0].data = s.curva;
  g.Eq.update("none");
  /* Monte Carlo */
  const f = p.rischio / 100, mc = montecarlo(R, f), b = mc.bande;
  g.Fan.$bande = b;
  [b.p5, b.p95, b.p25, b.p75, b.p50].forEach((serie, i) => { g.Fan.data.datasets[i].data = serie; });
  g.Fan.update("none");
  const fin = Array.from(mc.finali, e => (e - 1) * 100), binF = classi(fin, [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000, 5000]);
  g.Fin.data.datasets[0].data = binF;
  g.Fin.data.datasets[0].backgroundColor = binF.map(x => alfa(x.x >= 0 ? c.s1 : c.neg, 0.85));
  g.Fin.update("none");
  const anniMc = s.perAnno ? 200 / s.perAnno : null;
  document.getElementById("lab-mc-nota").textContent =
    `4.000 percorsi da 200 operazioni pescate a caso, con reinserimento, dalle ${s.n} operazioni passate, rischiando ${nf(p.rischio, 2)}% del capitale per operazione.` +
    (anniMc ? ` Al ritmo storico 200 operazioni sono circa ${nf(anniMc, anniMc < 10 ? 1 : 0)} anni.` : "");
  const qf = q => pct(quantile(mc.finali, q) - 1, 0), qd = q => pctNoSegno(quantile(mc.dd, q), 0);
  document.getElementById("lab-mc").innerHTML = `
    <dt>Capitale finale, 5% peggiore</dt><dd>${qf(0.05)}</dd>
    <dt>Capitale finale, mediana</dt><dd>${qf(0.5)}</dd>
    <dt>Capitale finale, 5% migliore</dt><dd>${qf(0.95)}</dd>
    <dt>Probabilità di chiudere in perdita</dt><dd>${pctNoSegno(mc.pPerdita, 0)}</dd>
    <dt>Discesa massima, mediana</dt><dd>${qd(0.5)}</dd>
    <dt>Discesa massima, 5% peggiore</dt><dd>${qd(0.95)}</dd>
    <dt>Probabilità di perdere metà del capitale</dt><dd>${pctNoSegno(mc.pMeta, 1)}</dd>`;
  /* ultime operazioni */
  const ultime = ops.slice(-30).reverse();
  document.getElementById("lab-ops").innerHTML = `<table><thead><tr><th>Ingresso</th><th>Lato</th><th>Sedute</th><th>R</th><th>Uscita</th></tr></thead><tbody>${
    ultime.map(o => `<tr><td>${dataBreve(st.date[o.ie])}</td><td>${o.lato === 1 ? "long" : "short"}</td><td>${o.durata}</td>
      <td>${conSegno(o.R, 2)}</td><td>${o.motivo}</td></tr>`).join("")}</tbody></table>`;
}

/* ---------- ricerca ---------- */
const LATI = {long: "solo long", short: "solo short", entrambi: "long e short", curva: "nel verso della curva"};
const etichettaCfg = c => `${c.famiglia}, ${LATI[c.lato]}` + (c.ingresso === "rottura" ? `, rottura di ${c.Nr} sedute` : `, ingresso oltre ${sgm(c.k)}`) +
  `, stop ${sgm(c.S)}` + (c.T ? `, trailing ${sgm(c.T)}` : "") + (c.G ? `, target ${sgm(c.G)}` : "") + (c.H ? `, ${c.H} sedute al massimo` : "") +
  (c.strategia === "combinata" ? `, fase con ${c.indicatore === "autocorrelazione" ? "l'autocorrelazione" : "la forza del trend"} su ${c.N} sedute` : "");
const pctAnno = x => x == null ? "–" : pct(x, 1);
const tCella = v => v && v.n ? `${conSegno(v.media, 2)}R <span class="piccolo">t ${conSegno(v.t, 1)} · ${v.n}</span>` : "–";

async function ricerca() {
  app.innerHTML = `<button class="indietro" onclick="indietro()">‹ Indietro</button><h1>Ricerca di una regola</h1><p class="vuoto">Carico i risultati…</p>`;
  let R;
  try {
    const r = await fetch("ricerca.json", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status === 404 ? "non ancora eseguita" : "HTTP " + r.status);
    R = await r.json();
  } catch (e) {
    app.innerHTML = `<button class="indietro" onclick="indietro()">‹ Indietro</button><h1>Ricerca di una regola</h1>
      <p class="vuoto">Risultati non disponibili (${esc(e.message)}).<br>Avvia il workflow «Ricerca strategie» dalla scheda Actions del repository.</p>`;
    return;
  }
  if (location.hash !== "#ricerca") return;
  stato.ricerca = R;
  const P = R.protocollo, m = R.mercati, sc = R.scelta, nome = s => (m[s] && m[s].nome) || s;
  const sel = P.selezione, ver = P.verifica.filter(s => m[s]);
  const rif = (s, per) => R.riferimenti[s] && R.riferimenti[s][per];
  const rigaRif = (etichetta, chiave, periodi, s) => `<tr><td>${etichetta}</td>${periodi.map(per => {
    const v = rif(s, per) && rif(s, per)[chiave];
    return `<td>${v ? `${pctAnno(v.annuo)} <span class="piccolo">discesa ${pctNoSegno(v.discesa, 0)}</span>` : "–"}</td>`; }).join("")}</tr>`;
  const tabRif = s => `<h3 style="font-size:14px;margin-top:12px">${esc(nome(s))}${m[s].rinnovata ? "" : " · serie non rinnovata"}</h3>
    <table><thead><tr><th></th>${sel.includes(s) ? `<th>Prima metà</th><th>Seconda metà</th>` : `<th>Tutto</th>`}</tr></thead><tbody>
    ${["long", "short", "curva"].filter(k => rif(s, sel.includes(s) ? "prima" : "tutto")[k]).map(k =>
      rigaRif({long: "Sempre long", short: "Sempre short", curva: "Verso della curva"}[k], k, sel.includes(s) ? ["prima", "seconda"] : ["tutto"], s)).join("")}
    </tbody></table>`;

  let giudizio = "Nessuna regola ha abbastanza operazioni.";
  if (sc) {
    const fuori = sc.punteggioOOS, ng = sc.oos["NG=F"], cl = sc.oos["CL=F"];
    giudizio = fuori >= 2 && ng.media > 0 && cl.media > 0
      ? "Fuori campione la regola scelta resta positiva su entrambi i mercati con t sopra 2: è un candidato da seguire, prima in demo."
      : fuori > 1 ? "Fuori campione resta positiva, ma con t tra 1 e 2: un effetto di questa misura può uscire anche per caso."
      : fuori > 0 ? "Fuori campione il risultato è vicino a zero: sta dentro il rumore."
      : "Fuori campione la regola scelta perde: il buon risultato dentro il campione veniva dalla selezione, non da un vantaggio stabile.";
  }
  const rho = R.correlazioneSpearman;
  const fraseRho = rho == null ? "" : rho < 0.2
    ? `La classifica dentro il campione non anticipa quella fuori (correlazione di rango ${nf(rho, 2)}): qui scegliere i parametri migliori sulla storia non serve.`
    : rho < 0.5 ? `La classifica dentro il campione anticipa poco quella fuori (correlazione di rango ${nf(rho, 2)}).`
    : `La classifica dentro il campione anticipa in buona parte quella fuori (correlazione di rango ${nf(rho, 2)}): le differenze tra famiglie di regole sono in parte stabili.`;
  const famiglie = R.famiglie.slice(0, 12);

  app.innerHTML = `
    <button class="indietro" onclick="indietro()">‹ Indietro</button>
    <h1>Ricerca di una regola</h1>
    <p class="meta">Eseguita il ${dataBreve(R.generato.slice(0, 10))} su ${nf(P.regole, 0)} regole</p>
    <section class="card sezione-testo">
      <p><b>Protocollo, fissato prima di guardare i risultati.</b> I parametri si scelgono sulla prima metà della storia di ${sel.map(nome).join(" e ")} (fino al ${dataBreve(m[sel[0]].meta)}): vince la regola con la media più alta dei t statistici del risultato in R. La seconda metà degli stessi mercati e ${ver.map(nome).join(" e ")} servono solo a verificare. σ EWMA, che non usa dati futuri.</p>
      ${sel.some(s => m[s].fineEia) ? `<p><b>Dati.</b> Per ${sel.map(nome).join(" e ")} fino al ${dataBreve(m[sel[0]].fineEia)} prezzi di regolamento EIA del primo e del secondo contratto; dopo, serie continua di Yahoo con il giorno del cambio di contratto messo a zero. Lo spread tra i due contratti, che serve alle regole della curva, c'è fino a quella data e nei giorni in cui l'app ha salvato la curva: nella seconda metà copre ${sel.map(s => `${pctNoSegno(m[s].spreadSeconda, 0)} delle sedute su ${nome(s)}`).join(" e ")}.</p>` : ""}
      <p><b>Costi del CFD Fineco.</b> Spread di andata e ritorno ${sel.map(s => `${nf(P.costo[s], 2)}% su ${nome(s)}`).join(", ")}, pagato di nuovo a ogni scadenza attraversata; finanziamento ${nf(P.finanzLong, 2)}% annuo sui long e ${finTesto(P.finanzShort)} sugli short (Euribor 1 mese al ${nf(P.euribor, 1)}%).</p>
    </section>
    <section class="card"><h3>Senza regole</h3>
      <p class="nota">Rendimento annuo sul controvalore, al netto dei costi. «Verso della curva»: short quando il secondo contratto costa più del primo (contango), long nel caso opposto, cambiando lato quando cambia la curva.</p>
      ${Object.keys(R.riferimenti).map(tabRif).join("")}
    </section>
    ${sc ? `<section class="card"><h3>La regola scelta</h3>
      <div class="regola">${esc(descriviRegole({...sc.cfg, fase: "tutte", dirTrend: "tutte", costo: P.costo["NG=F"], finanz: P.finanzLong, finanzShort: P.finanzShort, Nr: sc.cfg.Nr ?? 55, N: sc.cfg.N ?? 60, indicatore: sc.cfg.indicatore ?? "forza"}, true))}</div>
      <table style="margin-top:8px"><thead><tr><th>Dove</th><th>R medio, t, operazioni</th></tr></thead><tbody>
        ${sel.map(s => `<tr><td>${esc(nome(s))}, prima metà <span class="piccolo">(scelta)</span></td><td>${tCella(sc.is[s])}</td></tr>`).join("")}
        ${sel.map(s => `<tr><td>${esc(nome(s))}, seconda metà</td><td>${tCella(sc.oos[s])}</td></tr>`).join("")}
        ${ver.map(s => `<tr><td>${esc(nome(s))}, tutto${m[s].rinnovata ? "" : " (non rinnovata)"}</td><td>${tCella(sc.verifica[s])}</td></tr>`).join("")}
      </tbody></table>
      <div class="regola">${giudizio}</div>
      <button class="azione" onclick="provaRicerca()">Apri la regola nel laboratorio del gas</button>
    </section>` : ""}
    ${R.esempi ? sezioneEsempi(R) : ""}
    <section class="card"><h3>Quanto conta la scelta</h3>
      <p class="nota">${fraseRho} Fuori campione è positiva ${pctNoSegno(R.quotaRegoleConOOSPositivo, 0)} delle ${nf(R.regoleAmmesse, 0)} regole con abbastanza operazioni, e ${R.topOOSpositive} delle 10 migliori dentro il campione.</p>
      <details><summary>Le 10 migliori dentro il campione</summary>
      <table><thead><tr><th>Regola</th><th>t dentro</th><th>t fuori</th></tr></thead><tbody>
        ${R.migliori.map(x => `<tr><td>${esc(etichettaCfg(x.cfg))}</td><td>${conSegno(x.punteggioIS, 2)}</td><td>${conSegno(x.punteggioOOS, 2)}</td></tr>`).join("")}
      </tbody></table></details>
    </section>
    <section class="card"><h3>Famiglie di regole</h3>
      <p class="nota">Media su tutte le regole della famiglia, senza scegliere i parametri: è il confronto meno esposto alla fortuna. t medio dentro e fuori campione, quota di regole positive fuori.</p>
      <table><thead><tr><th>Famiglia</th><th>t dentro</th><th>t fuori</th><th>Positive</th></tr></thead><tbody>
        ${famiglie.map(f => `<tr><td>${esc(f.famiglia)}, ${LATI[f.lato]}</td><td>${conSegno(f.tIS, 2)}</td><td>${conSegno(f.tOOS, 2)}</td><td>${pctNoSegno(f.quotaPositiveOOS, 0)}</td></tr>`).join("")}
      </tbody></table>
    </section>
    <p class="piede">Il t statistico è il risultato medio diviso per il suo errore standard: sotto 2 un risultato può uscire anche per caso. Su ${nf(P.regole, 0)} regole provate, qualcuna supera 2 dentro il campione anche se nessuna ha un vantaggio: per questo conta solo la verifica fuori. Le operazioni di una stessa regola si sovrappongono nel tempo tra un mercato e l'altro, quindi le due metà non sono campioni del tutto indipendenti.</p>`;
}
function sezioneEsempi(R) {
  const m = R.mercati, prove = [["NG=F", "prima"], ["NG=F", "seconda"]];
  const altre = [["CL=F", "prima"], ["CL=F", "seconda"], ["BZ=F", "tutto"], ["TTF=F", "tutto"]];
  const cella = v => v && v.n ? `${conSegno(v.media, 2)}R` : "–";
  const righe = R.esempi.map((e, i) => {
    const alt = altre.map(([s, per]) => e.ris[s + ":" + per]).filter(v => v && v.n >= R.protocollo.minOperazioni);
    const tutte = e.prove > 0 && e.positive === e.prove;
    return `<tr onclick="provaEsempio(${i})" style="cursor:pointer${tutte ? ";font-weight:600" : ""}"><td>${esc(e.nome)}, ${LATI[e.lato]}</td>
      ${prove.map(([s, per]) => `<td>${cella(e.ris[s + ":" + per])}</td>`).join("")}<td>${alt.filter(v => v.media > 0).length} su ${alt.length}</td></tr>`;
  }).join("");
  return `<section class="card"><h3>Gli esempi del laboratorio</h3>
    <p class="nota">Le cinque regole di esempio esistevano prima della ricerca, quindi provarle non è una scelta fatta sui risultati. Scegliere il lato guardando questa tabella invece lo è: anche la riga migliore resta un'ipotesi da seguire senza soldi veri prima di crederci. R medio per operazione sul gas Henry Hub nelle due metà, e in quante delle altre prove (WTI nelle due metà, Brent, TTF) è positivo. In grassetto le righe positive in tutte le prove. Tocca una riga per aprirla nel laboratorio.</p>
    <table><thead><tr><th>Regola</th><th>Gas 1ª metà</th><th>Gas 2ª metà</th><th>Altre prove positive</th></tr></thead><tbody>${righe}</tbody></table>
  </section>`;
}
function apriInLaboratorio(c) {
  const R = stato.ricerca;
  Object.assign(stato.lab, {strategia: c.strategia, ingresso: c.ingresso, lato: c.lato, k: c.k, Nr: c.Nr ?? 55, S: c.S, T: c.T, G: c.G, H: c.H,
    indicatore: c.indicatore ?? "forza", N: c.N ?? 60, fase: "tutte", dirTrend: "tutte", sigma: "ewma", periodo: "tutto",
    finanz: R.protocollo.finanzLong, finanzShort: R.protocollo.finanzShort});
  stato.labMercato = null;                       /* così il laboratorio riprende lo spread del mercato */
  location.hash = "lab=" + encodeURIComponent("NG=F");
}
function provaEsempio(i) { apriInLaboratorio(stato.ricerca.esempi[i].cfg); }
function provaRicerca() { apriInLaboratorio(stato.ricerca.scelta.cfg); }

/* ---------- metodo ---------- */
function metodo() {
  const p = stato.dati.parametri;
  app.innerHTML = `<button class="indietro" onclick="indietro()">‹ Mercati</button>
  <h1>Come sono fatti i conti</h1>
  <section class="card sezione-testo">
    <p><b>Rendimenti.</b> Logaritmici tra chiusure consecutive, dal ${dataBreve(stato.dati.inizio)} o dall'inizio della serie su Yahoo. Le chiusure negative o nulle non vengono scavalcate, e i giorni fermi con volume zero sono esclusi.</p>
    <p><b>Volatilità realizzata.</b> Radice della media dei rendimenti al quadrato delle ultime ${p.finestra_realizzata} sedute, moltiplicata per √${p.giorni_anno}. Guarda indietro.</p>
    <p><b>EWMA.</b> Media esponenziale dei rendimenti al quadrato con λ = ${nf(p.lambda_ewma, 2)}, come in RiskMetrics. Reagisce in fretta e non ha un livello di lungo periodo verso cui tornare.</p>
    <p><b>GJR-GARCH(1,1) con t di Student.</b> La varianza di domani dipende da una base (ω), dallo shock di oggi (α), da un termine in più quando lo shock è negativo (γ) e dalla varianza di oggi (β). Gli shock seguono una t di Student con ν gradi di libertà stimati. Persistenza = α + γ/2 + β; l'emivita è il numero di sedute in cui uno shock di volatilità si dimezza. γ può uscire negativo: sulle commodity spesso sono i rialzi ad alzare la volatilità.</p>
    <p><b>z.</b> Rendimento dell'ultima seduta diviso per la σ che il GARCH prevedeva per quella seduta.</p>
    <p><b>Distribuzione grezza.</b> Rendimenti divisi per la deviazione standard di tutto il campione: è la distribuzione incondizionata, quella su cui ragiona Taleb. La t di Student è stimata su questi dati.</p>
    <p><b>Divisi per σ GARCH.</b> Ogni rendimento diviso per la σ prevista per quel giorno. Toglie l'effetto dei periodi agitati: la coda che resta è quella che il GARCH non spiega.</p>
    <p><b>Indice di coda α (Hill).</b> Stimato sul ${nf(p.quote_hill.q25 * 100, 1)}% delle sedute più estreme; tra parentesi l'intervallo usando l'1% e il 5%. Più è basso, più la coda è spessa. Sotto 4 il momento quarto non è finito e la varianza stimata dal campione è instabile.</p>
    <p><b>Quota del giorno più estremo.</b> Peso della seduta più estrema sulla somma dei rendimenti alla quarta. Se una sola seduta pesa molto, la curtosi del campione dipende da quella seduta.</p>
    <p><b>VaR ed ES all'1%.</b> Perdita giornaliera superata nell'1% delle sedute e perdita media in quelle sedute, dalla storia.</p>
    <p><b>La chiusura di domani.</b> Quantili con la σ GARCH della prossima seduta e la t di Student stimata, senza drift.</p>
    <p><b>Volatilità implicita.</b> VIX, VXN, OVX e GVZ sono volatilità implicite a 30 giorni (OVX e GVZ dalle opzioni sugli ETF USO e GLD). La differenza con la previsione GARCH a ${p.orizzonte_mese} sedute è una misura approssimata del premio per il rischio di varianza.</p>
    <p><b>Laboratorio.</b> Simula una regola su tutto lo storico del mercato, una posizione alla volta. Ingressi e uscite avvengono alle chiusure: si entra quando la seduta chiude oltre la soglia in σ e si esce alla prima chiusura che tocca stop, trailing, target o durata massima. σ è quella prevista per la seduta dopo l'ingresso. Il risultato di ogni operazione è in R, cioè in multipli della perdita allo stop iniziale, al netto del costo. Le 200 operazioni future sono pescate a caso, con reinserimento, da quelle passate. Per evitare di scegliere parametri fortunati, guarda se la regola tiene in entrambe le metà del periodo e con soglie vicine.</p>
    <p><b>Fasi di mercato.</b> La forza del trend è il rendimento delle ultime N sedute diviso per quello che farebbe una passeggiata casuale con la stessa volatilità, stimata dalla media dei rendimenti in valore assoluto. Usa solo dati già noti alla chiusura. Su una passeggiata casuale un terzo delle sedute sta sotto 0,5 (fase laterale), un terzo tra 0,5 e 1 e un terzo sopra 1 (fase di trend). Le soglie sono fisse e non vengono scelte guardando i risultati. In alternativa la fase si misura con l'autocorrelazione: il variance ratio confronta la varianza dei rendimenti a 5 sedute con cinque volte quella giornaliera. Sotto 1 i movimenti tendono a rientrare, sopra 1 a proseguire; le soglie sono i terzili ottenuti su una passeggiata casuale con la stessa finestra. La strategia combinata usa il contrarian nella prima fase e il trend following nella terza, con le stesse uscite.</p>
    <p><b>Serie rinnovate.</b> Per gas Henry Hub e petrolio WTI la serie è quella di chi tiene un CFD Fineco: il CFD segue un contratto alla volta e si chiude d'ufficio nel suo ultimo giorno di negoziazione (per il gas lo stesso giorno del future, per il petrolio due giorni lavorativi prima), quindi chi vuole restare dentro riapre sul contratto successivo e paga di nuovo lo spread. I rendimenti sono quelli del contratto tenuto; nel giorno del cambio non c'è il salto della serie continua. Storico dai prezzi di regolamento NYMEX del primo e del secondo contratto pubblicati dall'EIA, ultime sedute dai singoli contratti su Yahoo; i livelli sono rettificati all'indietro in proporzione, così l'ultimo valore è il prezzo del contratto da tenere. Lo spread tra secondo e primo contratto dice se la curva è in contango (positivo: il roll paga chi è short) o in backwardation.</p>
    <p><b>Costi nel laboratorio.</b> Spread di andata e ritorno a ogni operazione e, sulle serie rinnovate, a ogni scadenza del CFD attraversata. Finanziamento giornaliero: per Fineco Euribor 1 mese + 2,95% annuo sui long, Euribor − 2,95% sugli short (con l'Euribor al 2,2% è un addebito dello 0,75%).</p>
    <p><b>Limiti.</b> Brent, TTF e metalli usano la serie del future più vicino senza rettifica per il cambio di contratto: nei giorni di roll compaiono salti che non sono rendimenti veri, soprattutto sul TTF. I dati di Yahoo possono contenere errori o arrivare in ritardo; quelli dell'EIA si aggiornano una volta alla settimana.</p>
  </section>`;
}
