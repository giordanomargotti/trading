<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7;--surface:#fcfcfb;--surface2:#f1f0ec;--text:#0b0b0b;--text2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neg:#e34948;
  --up:#006300;--down:#d03b3b;--chip-bg:rgba(250,178,25,.24);--chip-text:#6b4a00;
  --accent:#184f95;--on-accent:#ffffff;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--surface2:#242422;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--neg:#e66767;
  --up:#0ca30c;--down:#e66767;--chip-bg:rgba(250,178,25,.18);--chip-text:#fab219;
  --accent:#6da7ec;--on-accent:#0d0d0d;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:20px;font-weight:500;margin:0}
h2{font-size:13px;font-weight:500;color:var(--text2);margin:20px 4px 6px}
h3{font-size:16px;font-weight:500;margin:0 0 2px}
p{margin:0}
button{font:inherit;color:inherit}
.testa{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 2px}
.meta{font-size:13px;color:var(--text2)}
.azioni{display:flex;gap:6px}
.btn{background:transparent;border:.5px solid var(--axis);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:36px}
.btn:active{transform:scale(.98)}
.avviso{background:var(--chip-bg);color:var(--chip-text);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.errore{background:rgba(227,73,72,.12);color:var(--down);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.lista{background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.riga{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:transparent;border:0;border-bottom:.5px solid var(--border);text-align:left;cursor:pointer;min-height:56px}
.riga:last-child{border-bottom:0}
.riga:active{background:var(--surface2)}
.r-sx{flex:1;min-width:0;display:flex;flex-direction:column}
.r-nome{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-dx{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.r-prezzo{font-size:15px}
.su{color:var(--up)}.giu{color:var(--down)}
.spark{flex:0 0 64px;height:24px}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--chip-bg);color:var(--chip-text);border-radius:6px;padding:0 6px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.chip svg{width:10px;height:10px}
.indietro{background:none;border:0;color:var(--accent);padding:8px 0;font-size:15px;cursor:pointer;min-height:44px}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.hero .prezzo{font-size:28px;font-weight:500}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px 14px 12px;margin:12px 0}
.nota{font-size:13px;color:var(--text2);margin:2px 0 10px}
.piccolo{font-size:12px;color:var(--text2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.tile{background:var(--surface2);border-radius:8px;padding:8px 10px}
.tile .l{font-size:12px;color:var(--text2)}

.grafico{position:relative;width:100%}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text2);margin:6px 0}

.q{display:inline-block;width:10px;height:10px;border-radius:2px}
.lin{display:inline-block;width:16px;height:0;border-top:2px solid}
.lin.tr{border-top-style:dashed}
.seg{display:inline-flex;background:var(--surface2);border-radius:8px;padding:2px;gap:2px}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 0 0 .5px var(--border)}

tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin-top:8px}
.kv dt{color:var(--text2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--accent);padding:6px 0}
.sezione-testo p{font-size:14px;margin:0 0 10px}
.sezione-testo b{font-weight:500}
.vuoto{text-align:center;color:var(--text2);padding:48px 12px}
.azione{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:500;margin:12px 0;cursor:pointer;min-height:44px}
.cursore{display:grid;grid-template-columns:112px minmax(0,1fr) 64px;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.cursore label{color:var(--text2)}
.cursore output{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chip-btn{background:var(--surface2);border:0;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:32px}
.regola{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0 4px}
.piede{font-size:12px;color:var(--muted);margin-top:16px}
/* ----- struttura: barra in basso, riquadri che si aprono, foglio delle spiegazioni ----- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.marchio{font-size:22px;font-weight:600;letter-spacing:-.01em}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:.5px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.barra-int{display:flex;max-width:560px;margin:0 auto}
.barra a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;font-size:11px;color:var(--text2);text-decoration:none;min-height:54px}
.barra a[aria-current="page"]{color:var(--accent);font-weight:500}
.barra svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;color:var(--accent);padding:8px 0;font-size:14px;cursor:pointer;min-height:44px;text-align:left}
.fila{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:4px}
.segnale{font-size:19px;font-weight:500;line-height:1.3;margin:8px 0;font-variant-numeric:tabular-nums}
.azione:disabled{background:var(--surface2);color:var(--text2);cursor:default}
.azione.sec{background:transparent;color:var(--accent);border:.5px solid var(--axis)}
.avviso .azione{margin:10px 0 2px}
details.piega{padding:0;margin:8px 0;font-size:inherit}
details.piega>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 16px;column-gap:10px;align-items:center;padding:11px 14px;color:var(--text);min-height:56px}
details.piega>summary::-webkit-details-marker{display:none}
.p-t{font-size:15px;font-weight:500}
.p-s{grid-column:1;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-f{grid-column:2;grid-row:1 / span 2;width:16px;height:16px;color:var(--muted);transition:transform .15s}
details.piega[open]>summary .p-f{transform:rotate(90deg)}
details.piega[open]>summary .p-s{white-space:normal}
.p-c{padding:0 14px 12px}
.chiave .tile .v{font-size:17px}
.fissa{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -16px;padding:8px 16px;border-bottom:.5px solid var(--border)}
.fissa select{font:inherit;font-size:16px;font-weight:500;color:var(--text);background:var(--surface);border:.5px solid var(--axis);border-radius:8px;padding:6px 8px;max-width:100%;min-height:38px}
.seg.largo{display:flex;margin-top:8px}
.seg.largo button{flex:1}
.esito{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums;margin-top:8px;min-height:20px}
.esito b{color:var(--text);font-weight:500}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
dialog.foglio{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:88vh;border-radius:16px 16px 0 0;background:var(--surface);color:var(--text)}
dialog.foglio::backdrop{background:rgba(0,0,0,.45)}
.foglio-int{padding:18px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;max-height:88vh}
.foglio-int h2{font-size:17px;font-weight:500;color:var(--text);margin:0 0 10px;outline:none}
.foglio-int p{font-size:14px;margin:0 0 10px}
.foglio-int b{font-weight:500}
.foglio-int label{display:block;font-size:13px;color:var(--text2);margin:10px 0 4px}
.foglio-int input[type=date],.foglio-int select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:.5px solid var(--axis);border-radius:8px;padding:8px;min-height:40px;width:100%}
@media (prefers-reduced-motion:reduce){.p-f{transition:none}}
</style>

<body>
<main id="app"><p class="vuoto">Carico i dati…</p></main>
<nav class="barra" aria-label="Sezioni"><div class="barra-int">
  <a href="#oggi" id="nav-oggi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>Oggi</a>
  <a href="#mercati" id="nav-mercati"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16.5l5.5-6.5 4 3.5L20 5.5"/><path d="M3 20.5h18"/></svg>Mercati</a>
  <a href="#strategia" id="nav-strategia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v5.4m0 5.2V20M12 4v1.4m0 5.2V20M19 4v9.4m0 5.2V20"/><circle cx="5" cy="12" r="2.6"/><circle cx="12" cy="8" r="2.6"/><circle cx="19" cy="16" r="2.6"/></svg>Strategia</a>
</div></nav>
<dialog class="foglio" id="foglio" aria-labelledby="foglio-titolo"><div class="foglio-int" id="foglio-int"></div></dialog>
<script src="../vendor/chart.umd.min.js"></script>
<script src="../motore.js"></script>
<script>
"use strict";
const app = document.getElementById("app");
const stato = {dati: null, modo: "grezzi", scala: "lin", grafici: [], scrollElenco: 0};

window.addEventListener("error", e => mostraErrore(e.message || String(e)));
window.addEventListener("unhandledrejection", e => mostraErrore(String(e.reason && e.reason.message || e.reason)));
function mostraErrore(msg) {
  const d = document.createElement("div");
  d.className = "errore";
  d.textContent = "Errore: " + msg;
  app.prepend(d);
}

/* ---------- formattazione ---------- */
const MENO = "−";
const nf = (x, d) => Number(x).toLocaleString("it-IT", {minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: "always"});
function conSegno(x, d) {
  const s = nf(Math.abs(x), d);
  if (!/[1-9]/.test(s)) return s;                  /* niente "−0,0" */
  return (x > 0 ? "+" : MENO) + s;
}
const pct = (x, d = 2) => x == null ? "–" : conSegno(x * 100, d) + "%";
const pctNoSegno = (x, d = 2) => x == null ? "–" : nf(x * 100, d) + "%";
const volp = x => x == null ? "–" : nf(x, 1) + "%";
const sigma = z => z == null ? "–" : conSegno(z, 1) + "σ";
const sgm = v => (Number.isInteger(v) ? nf(v, 0) : nf(v, 2)) + "σ";
function decimaliPrezzo(p) { const a = Math.abs(p); return a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : 3; }
const prezzo = p => p == null ? "–" : nf(p, decimaliPrezzo(p));
const tickPrezzo = v => Number(v).toLocaleString("it-IT", {maximumFractionDigits: 3, useGrouping: "always"});
function dataIt(s, opz) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("it-IT", opz || {weekday: "short", day: "numeric", month: "short", year: "numeric"});
}
const dataBreve = s => dataIt(s, {day: "numeric", month: "short", year: "numeric"});
function rapporto(x) {
  if (!isFinite(x)) return "–";
  return "×" + (x < 10 ? nf(x, 1) : nf(Math.round(x), 0));
}
/* "una seduta ogni N": più leggibile delle percentuali piccolissime */
function ogni(p) {
  if (!(p > 0)) return "mai";
  const n = 1 / p;
  if (n < 10) return nf(n, 1);
  if (n < 1e4) return nf(Math.round(n), 0);
  if (n < 1e6) return nf(Math.round(n / 1e3), 0) + " mila";
  if (n < 1e9) return nf(n / 1e6, 1) + " mln";
  return nf(n / 1e9, 1) + " mld";
}
const potenzaDi10 = v => v > 0 && Math.abs(Math.log10(v) - Math.round(Math.log10(v))) < 1e-9;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* ---------- densità ---------- */
function lnGamma(z) {
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lnGamma(1 - z);
  z -= 1;
  let x = c[0];
  for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  const t = z + g + 0.5;
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}
const normPdf = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
function tPdf(x, nu) {
  return Math.exp(lnGamma((nu + 1) / 2) - lnGamma(nu / 2) - 0.5 * Math.log(nu * Math.PI)
    - (nu + 1) / 2 * Math.log(1 + x * x / nu));
}
/* t con varianza unitaria, come nel GARCH */
function tStdPdf(x, nu) { const s = Math.sqrt((nu - 2) / nu); return tPdf(x / s, nu) / s; }

/* ---------- colori e Chart.js ---------- */
function colori() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return {text: v("--text"), text2: v("--text2"), muted: v("--muted"), grid: v("--grid"), axis: v("--axis"),
    surface: v("--surface"), s1: v("--s1"), s2: v("--s2"), s3: v("--s3"), neg: v("--neg")};
}
function alfa(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function impostaChart() {
  const c = colori();
  Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  Chart.defaults.font.size = 11;
  Chart.defaults.color = c.muted;
  Chart.defaults.animation = false;
  Chart.defaults.maintainAspectRatio = false;
  Chart.defaults.plugins.legend.display = false;
  Object.assign(Chart.defaults.plugins.tooltip, {backgroundColor: c.text, titleColor: c.surface, bodyColor: c.surface,
    padding: 8, cornerRadius: 6, displayColors: false, titleFont: {weight: "500"}});
  return c;
}
function assi(c, extra = {}) {
  const base = {grid: {color: c.grid, drawTicks: false}, border: {color: c.axis}, ticks: {padding: 6}};
  return {x: {...base, grid: {display: false}, ...extra.x}, y: {...base, ...extra.y}};
}
function nuovoGrafico(id, config) {
  const el = document.getElementById(id);
  if (!el) return null;
  const g = new Chart(el, config);
  stato.grafici.push(g);
  return g;
}
/* un grafico creato dentro un riquadro chiuso o una scheda nascosta nasce senza dimensioni:
   si ridisegna quando compare */
function ridimensiona(el) { el.querySelectorAll("canvas").forEach(cv => { const g = Chart.getChart(cv); if (g) g.resize(); }); }
function distruggi() { stato.grafici.forEach(g => g.destroy()); stato.grafici = []; }

/* etichette per gli assi temporali: un mese sì e uno no, l'anno sotto gennaio */
function tickMese(date) {
  return function (val, i) {
    const d = date[i];
    if (!d || i === 0 || i > date.length - 8 || date[i - 1].slice(0, 7) === d.slice(0, 7)) return "";
    const m = Number(d.slice(5, 7));
    if (m % 2 === 0) return "";
    const lab = dataIt(d, {month: "short"});
    return m === 1 ? [lab, d.slice(0, 4)] : lab;
  };
}

/* anteprima in docs/v2: dati, motore, libreria e icone stanno un livello sopra */
const BASE = "../";

/* ---------- caricamento ---------- */
async function carica() {
  const r = await fetch(BASE + "data.json", {cache: "no-store"});
  if (r.status === 404) throw new Error("NODATA");
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
/* storico completo di un mercato: una sola richiesta anche se lo chiedono più riquadri insieme */
stato.attese = {};
function caricaStoria(a) {
  if (stato.storie[a.storia]) return Promise.resolve(stato.storie[a.storia]);
  if (!stato.attese[a.storia]) {
    stato.attese[a.storia] = fetch(BASE + a.storia, {cache: "no-store"})
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(st => (stato.storie[a.storia] = st))
      .finally(() => { delete stato.attese[a.storia]; });
  }
  return stato.attese[a.storia];
}
async function avvia() {
  try {
    stato.dati = await carica();
    stato.storie = {};
    rotta();
  } catch (e) {
    distruggi();
    app.innerHTML = e.message === "NODATA"
      ? `<p class="vuoto">Dati non ancora generati.<br>Va avviato il workflow «Aggiorna dati» dalla scheda Actions del repository.</p>`
      : `<p class="vuoto">Dati non caricati (${esc(e.message)}).<br><button class="btn" onclick="avvia()">Riprova</button></p>`;
  }
}

/* ---------- elenco ---------- */
function sparkline(valori) {
  const v = valori.filter(x => x != null).slice(-60);
  if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), w = 64, h = 24, k = max - min || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 2 - (y - min) / k * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 64 24" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--text2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------- regole: nome e descrizione ---------- */
const LATI = {long: "solo long", short: "solo short", entrambi: "long e short", curva: "nel verso della curva"};
const TIPI = {contrarian: "Contrarian", trend: "Trend following", combinata: "Combinata"};
function nomeRegola(p) {
  for (const [nome, r] of Object.entries(PRESET)) if (Object.keys(r).every(k => p[k] === r[k])) return nome;
  return null;
}
const titoloRegola = p => nomeRegola(p) || `${TIPI[p.strategia]}, ${LATI[p.lato]}`;
function partiRegola(p) {
  const uscite = [`stop ${sgm(p.S)}`];
  if (p.T > 0) uscite.push(`trailing ${sgm(p.T)}`);
  if (p.G > 0) uscite.push(`target ${sgm(p.G)}`);
  if (p.H > 0) uscite.push(`${p.H} sedute al massimo`);
  return {ingresso: p.ingresso === "rottura" ? `rottura di ${p.Nr} sedute` : `seduta oltre ${sgm(p.k)}`, uscite: uscite.join(", ")};
}
function descriviRegole(p) {
  const verso = (lato, dir) => (lato === 1 ? "acquisto" : "vendita allo scoperto") + (p.ingresso === "rottura"
    ? ` alla chiusura ${dir === "giu" ? "sotto il minimo" : "sopra il massimo"} delle ${p.Nr} sedute precedenti`
    : ` alla chiusura di una seduta che ${dir === "giu" ? "scende" : "sale"} oltre ${sgm(p.k)}`);
  const ingressiDi = regola => {
    const v = [], cLong = regola === "contrarian" ? "giu" : "su", cShort = regola === "contrarian" ? "su" : "giu";
    if (p.lato === "curva") return `${verso(1, cLong)} se la curva è in backwardation; ${verso(-1, cShort)} se è in contango`;
    if (p.lato !== "short") v.push(verso(1, cLong));
    if (p.lato !== "long") v.push(verso(-1, cShort));
    return v.join("; ");
  };
  const maiuscola = t => t.charAt(0).toUpperCase() + t.slice(1);
  const ingressi = [];
  if (p.strategia === "combinata") {
    const nomi = nomiFase(p);
    ingressi.push(`Nella fase «${nomi.laterale.toLowerCase()}»: ${ingressiDi("contrarian")}`);
    ingressi.push(`Nella fase «${nomi.trend.toLowerCase()}»: ${ingressiDi("trend")}. Nella fase «${nomi.intermedia.toLowerCase()}» nessun ingresso`);
  } else {
    ingressi.push(maiuscola(ingressiDi(p.strategia)));
    if (p.fase !== "tutte") ingressi.push(`Solo nella fase «${nomiFase(p)[p.fase].toLowerCase()}»`);
  }
  if (p.dirTrend !== "tutte") ingressi.push(`Solo ${p.dirTrend === "favore" ? "a favore del" : "contro il"} trend delle ultime ${p.N} sedute`);
  const uscite = [`con una perdita di ${sgm(p.S)} dall'ingresso`];
  if (p.T > 0) uscite.push(`con un ritorno di ${sgm(p.T)} dal punto migliore`);
  if (p.G > 0) uscite.push(`con un guadagno di ${sgm(p.G)}`);
  if (p.H > 0) uscite.push(`dopo ${p.H} sedute`);
  return `${ingressi.join(". ")}. Uscita alla chiusura ${uscite.join(", ").replace(/, ([^,]*)$/, " o $1")}.`;
}

/* I tre profili: lineare y = x; convesso con perdita fissa del 10% e guadagno che cresce con il
   quadrato del rialzo; concavo con guadagno fisso del 10% e perdita che cresce con il quadrato del
   ribasso. Sono curve di esempio. */
function graficoConvessita() {
  const cv = document.getElementById("gConv");
  if (!cv) return;
  const c = impostaChart();
  const conv = x => -10 + 0.06 * Math.max(x, 0) ** 2, conc = x => 10 - 0.04 * Math.min(x, 0) ** 2;
  const xs = Array.from({length: 101}, (_, i) => i - 50), pari = Math.sqrt(10 / 0.06);
  const linea = (nome, colore, f) => ({label: nome, data: xs.map(x => ({x, y: f(x)})), borderColor: colore, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4});
  const punti = [
    {x: -40, y: conv(-40), colore: c.s3, testo: "Perdita fissa −10%", dx: -24, dy: -15, align: "left"},
    {x: 40, y: conv(40), colore: c.s3, testo: "Guadagno aperto +86%", dx: -10, dy: 0, align: "right"},
    {x: pari, y: 0, colore: c.s3, testo: "Pareggio", dx: 9, dy: 13, align: "left"},
    {x: -40, y: conc(-40), colore: c.s2, testo: "Crollo −54%", dx: 10, dy: 0, align: "left"},
  ];
  const nomi = [
    {x: 47.4, y: conv(47.4), testo: "Convessa", dx: -9, dy: 0, align: "right", forte: true},
    {x: 50, y: 30, testo: "Lineare", dx: -3, dy: 0, align: "right", forte: true},
    {x: 50, y: 10, testo: "Concava", dx: -3, dy: 12, align: "right", forte: true},
  ];
  const etichette = {id: "etichette", afterDatasetsDraw(ch) {
    const ctx = ch.ctx, X = ch.scales.x, Y = ch.scales.y;
    ctx.save();
    ctx.font = `11px ${Chart.defaults.font.family}`;
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    for (const e of [...punti, ...nomi]) {
      const px = X.getPixelForValue(e.x) + e.dx, py = Y.getPixelForValue(e.y) + e.dy;
      ctx.textAlign = e.align;
      ctx.lineWidth = 3;
      ctx.strokeStyle = c.surface;
      ctx.strokeText(e.testo, px, py);
      ctx.fillStyle = e.forte ? c.text : c.text2;
      ctx.fillText(e.testo, px, py);
    }
    ctx.restore();
  }};
  stato.gConv = new Chart(cv, {type: "line", data: {datasets: [
      linea("Lineare", c.s1, x => x), linea("Concava", c.s2, conc), linea("Convessa", c.s3, conv),
      {data: punti.map(p => ({x: p.x, y: p.y})), showLine: false, pointRadius: 5, pointHoverRadius: 5,
        pointBackgroundColor: punti.map(p => p.colore), pointBorderColor: c.surface, pointBorderWidth: 2}]},
    options: {parsing: false, interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex < 3, callbacks: {
        title: it => it.length ? `Mercato ${conSegno(it[0].raw.x, 0)}%` : "",
        label: it => `${it.dataset.label}: ${conSegno(it.raw.y, 0)}%`}}},
      scales: assi(c, {
        x: {type: "linear", min: -50, max: 50, title: {display: true, text: "Variazione del mercato", color: c.muted, font: {size: 11}},
          grid: {display: true, drawTicks: false, color: ctx => ctx.tick && ctx.tick.value === 0 ? c.axis : "transparent"},
          ticks: {stepSize: 25, padding: 6, callback: v => v === 0 ? "0" : conSegno(v, 0) + "%"}},
        y: {min: -100, max: 150, grid: {drawTicks: false, color: ctx => ctx.tick && ctx.tick.value === 0 ? c.axis : c.grid},
          ticks: {stepSize: 50, padding: 6, callback: v => v === 0 ? "0" : conSegno(v, 0) + "%"}}})},
    plugins: [etichette]});
}

/* ---------- cosa dice la regola dopo l'ultima chiusura ---------- */
const MOTIVI = {trailing: "trailing stop", stop: "stop iniziale", target: "target", durata: "durata massima"};
/* la posizione segnata dall'utente, seguita con le uscite della regola a partire dalla chiusura d'ingresso */
function posizionePersonale(st, p, pos) {
  const i = st.date.indexOf(pos.data);
  if (i < 0) return null;
  return simulaStrategia(st, {...p, periodo: "tutto", ingressoForzato: {i, lato: pos.lato}}).ops[0] || null;
}
function htmlDimensione(a, p, s1, P) {
  const rischio = p.capitale * p.rischio / 100, stopPct = p.S * s1, ctrv = rischio / stopPct;
  let html = `<dl class="kv">${riga(`Rischio: ${nf(p.rischio, 2)}% di ${nf(p.capitale, 0)} €`, nf(rischio, 2) + " €")}
    ${riga(`Stop a ${sgm(p.S)}`, pctNoSegno(stopPct, 1) + " dal prezzo")}
    ${riga("Controvalore massimo", nf(ctrv, 0) + " €")}</dl>`;
  const lotto = LOTTI_FINECO[a.simbolo];
  if (lotto) {
    const cambio = stato.dati.cambio && stato.dati.cambio.EURUSD;
    const valLotto = lotto.molt * P / (cambio || 1), rischioLotto = valLotto * stopPct, troppo = valLotto > ctrv * 1.05;
    html += `<div class="${troppo ? "avviso" : "regola"}">Un lotto del ${lotto.nome} vale circa ${nf(valLotto, 0)} €: con questo stop il rischio è ${nf(rischioLotto, 0)} €, il ${pctNoSegno(rischioLotto / p.capitale, 1)} del capitale${troppo ? ", oltre il limite scelto." : "."}</div>`;
  }
  return html;
}
function htmlScadenza(a) {
  const rt = a.rettifica, cv = a.curva, v = [];
  if (rt && rt.prossimo_roll) v.push(`CFD di ${meseIt(rt.prossimo_roll.consegna)}: chiusura d'ufficio il ${dataBreve(rt.prossimo_roll.data)}. Per restare in posizione va riaperto sul contratto successivo, con un nuovo spread.`);
  if (cv) v.push(`Curva in ${cv.struttura}: il passaggio al contratto successivo favorisce ${cv.struttura === "contango" ? "lo short" : "il long"} (secondo contratto ${pct(cv.spread12, 1)} sul primo).`);
  return v.map(t => `<p class="piccolo" style="margin-top:8px">${t}</p>`).join("");
}
/* personale: nella pagina Oggi, dove conta la posizione segnata dall'utente */
function htmlSegnale(a, st, p, personale) {
  const n = st.c.length, P = st.c[n - 1], ultima = st.date[n - 1];
  const ris = simulaStrategia(st, {...p, periodo: "tutto"}), z = ris.daZero;
  const pos = personale && stato.posizione && stato.posizione.sim === a.simbolo ? stato.posizione : null;
  const op = pos ? posizionePersonale(st, p, pos) : null;
  const verso = l => l === 1 ? "Long" : "Short";
  if (pos && op && op.motivo === "aperta") {
    return `<p class="segnale">Uscita se la prossima chiusura è ${op.lato === 1 ? "sotto" : "sopra"} ${prezzo(op.livello)}</p>
      <dl class="kv">${riga(`${verso(op.lato)} dalla chiusura del ${dataBreve(pos.data)}`, prezzo(st.c[op.ie]))}
        ${riga(`Ultima chiusura, ${dataBreve(ultima)}`, prezzo(P))}
        ${riga("Distanza dall'uscita", pct(op.livello / P - 1, 1))}
        ${op.target ? riga("Target", prezzo(op.target)) : ""}
        ${op.restanti != null ? riga("Sedute rimaste", op.restanti) : ""}
        ${riga(`Risultato finora, in ${termine("R")}`, conSegno(op.R, 2) + "R")}
        ${op.rinnovi ? riga("Rinnovi a scadenza", op.rinnovi) : ""}</dl>
      ${op.rinnovi ? `<p class="piccolo" style="margin-top:6px">Dopo un rinnovo i prezzi passati sono riportati al contratto di oggi.</p>` : ""}
      ${htmlScadenza(a)}
      <button class="link" onclick="togliPosizione()">Togli la posizione</button>`;
  }
  if (pos && op) {
    return `<p class="segnale">Uscita scattata alla chiusura del ${dataBreve(st.date[op.iu])} a ${prezzo(st.c[op.iu])}</p>
      <dl class="kv">${riga(`${verso(op.lato)} dalla chiusura del ${dataBreve(pos.data)}`, prezzo(st.c[op.ie]))}
        ${riga("Motivo dell'uscita", MOTIVI[op.motivo] || op.motivo)}
        ${riga(`Risultato, in ${termine("R")}`, conSegno(op.R, 2) + "R")}
        ${riga("Risultato sul controvalore", pct(op.pct, 1))}</dl>
      <button class="azione" onclick="archiviaPosizione()">Chiudi e scrivi nel diario</button>
      <button class="link" onclick="togliPosizione()">Togli senza scrivere</button>`;
  }
  let html = "";
  if (pos) html += `<div class="avviso">La posizione segnata il ${dataBreve(pos.data)} non si può seguire: la data è fuori dallo storico. <button class="link" onclick="togliPosizione()">Togli la posizione</button></div>`;
  if (personale && ris.segnaleUltima) {
    html += `<div class="avviso">Ingresso ${ris.segnaleUltima === 1 ? "long" : "short"} scattato alla chiusura del ${dataBreve(ultima)} a ${prezzo(P)}.
      <button class="azione" onclick="segnaPosizione(${ris.segnaleUltima}, '${ultima}')">Segna la posizione come aperta</button></div>`;
  }
  if (!z || !z.regola) {
    html += `<p class="segnale">Nessun ingresso possibile alla prossima chiusura</p>
      <p class="nota">Fase di oggi: ${z && z.fase ? nomiFase(p)[z.fase].toLowerCase() : "non calcolabile"}. In questa fase la regola resta ferma.</p>`;
  } else if (!z.long && !z.short) {
    html += `<p class="segnale">Nessun ingresso possibile alla prossima chiusura</p><p class="nota">I filtri scelti escludono entrambi i versi.</p>`;
  } else {
    const frase = (nome, s) => `${nome} se la prossima chiusura è ${s.sopra ? "sopra" : "sotto"} ${prezzo(s.prezzo)}`;
    html += `<p class="segnale">${[z.short ? frase("Short", z.short) : "", z.long ? frase("Long", z.long) : ""].filter(Boolean).join("<br>")}</p>
      <dl class="kv">${riga(`Ultima chiusura, ${dataBreve(ultima)}`, prezzo(P))}
        ${z.short ? riga("Distanza dalla soglia short", pct(z.short.prezzo / P - 1, 1)) : ""}
        ${z.long ? riga("Distanza dalla soglia long", pct(z.long.prezzo / P - 1, 1)) : ""}</dl>`;
  }
  if (z && z.sigma) html += `<h3 style="font-size:14px;margin-top:14px">Dimensione di un nuovo ingresso</h3>${htmlDimensione(a, p, z.sigma, P)}`;
  html += htmlScadenza(a);
  const ult = ris.ops.length ? ris.ops[ris.ops.length - 1] : null;
  if (!personale && ult && ult.motivo === "aperta") {
    html += `<p class="piccolo" style="margin-top:8px">Seguita dall'inizio, la regola è ${ult.lato === 1 ? "long" : "short"} dal ${dataBreve(st.date[ult.ie])}: ${conSegno(ult.R, 2)}R finora, uscita con una chiusura ${ult.lato === 1 ? "sotto" : "sopra"} ${prezzo(ult.livello)}.</p>`;
  }

  return html;
}
function storiaSeguita() {
  const a = stato.dati.asset.find(x => x.simbolo === stato.seguita.sim);
  return {a, st: a && a.storia ? stato.storie[a.storia] : null};
}
function segnaPosizione(lato, data) { stato.posizione = {sim: stato.seguita.sim, lato, data}; ricorda(); rotta(); }
function togliPosizione() { stato.posizione = null; ricorda(); rotta(); }
function archiviaPosizione() {
  const pos = stato.posizione, {a, st} = storiaSeguita();
  const op = pos && st ? posizionePersonale(st, stato.seguita.p, pos) : null;
  if (op && op.motivo !== "aperta") {
    stato.diario.push({sim: pos.sim, nome: a.nome, lato: pos.lato, dal: pos.data, al: st.date[op.iu], R: Math.round(op.R * 100) / 100, motivo: op.motivo});
  }

}
function foglioPosizione() {
  const {st} = storiaSeguita();
  if (!st) return;
  const ultima = st.date[st.date.length - 1], lato = stato.seguita.p.lato;
  apriFoglio("Posizione già aperta", `
    <p>L'app segue la posizione con le uscite della regola, a partire dalla chiusura d'ingresso.</p>
    <label for="pos-data">Chiusura d'ingresso</label>
    <input type="date" id="pos-data" value="${ultima}" min="${st.date[0]}" max="${ultima}">
    ${lato === "long" || lato === "short" ? `<input type="hidden" id="pos-lato" value="${lato === "long" ? 1 : -1}">`
      : `<label for="pos-lato">Verso</label><select id="pos-lato"><option value="1">Long</option><option value="-1">Short</option></select>`}

/* ---------- pagina di un mercato ---------- */
function numeriChiave(a) {
  const v = a.vol, f = a.domani, q = f.t || f.n, dist = a.distribuzione, out = [];
  out.push(tessera("Volatilità attesa domani", volp(v.garch_domani != null ? v.garch_domani : v.ewma), `${pctNoSegno(f.sigma, 1)} al giorno`));
  out.push(tessera("Domani, al 90%", `${prezzo(q["5"])} – ${prezzo(q["95"])}`));
  const cc = dist.grezzi.code.find(x => x.k === 3), pG = stato.dati.gaussiana_code["3"];
  if (cc && pG) {
    const pOss = (cc.sinistra + cc.destra) / dist.n;
    out.push(tessera("Sedute oltre 3σ", pOss > 0 ? `1 ogni ${ogni(pOss)}` : "nessuna", `gaussiana: 1 ogni ${ogni(2 * pG)}`));
  }

function graficoDomani(a, c) {
  const f = a.domani, P = f.prezzo, s = f.sigma, nu = f.nu, conT = !!f.t;
  const xs = [], dt = [], dn = [], area = [];

    const jac = 1 / (s * p);
    const vt = conT ? tStdPdf(x, nu) * jac : null, vn = normPdf(x) * jac;
    xs.push(p);
    dt.push({x: p, y: vt});
    dn.push({x: p, y: vn});
    area.push({x: p, y: x >= lo && x <= hi ? (conT ? vt : vn) : null});
  }
  const ds = [
    {data: area, borderWidth: 0, pointRadius: 0, fill: "origin", backgroundColor: alfa(conT ? c.s2 : c.text2, 0.18), spanGaps: false},
    {data: dn, borderColor: c.text2, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0},
  ];
  if (conT) ds.push({data: dt, borderColor: c.s2, borderWidth: 2, pointRadius: 0});
  ds.push({data: [{x: P, y: 0}, {x: P, y: Math.max(...dn.map(p => p.y)) * 1.15}], borderColor: c.axis, borderWidth: 1, pointRadius: 0});
  nuovoGrafico("gDomani", {type: "line", data: {datasets: ds},
    options: {parsing: false, plugins: {tooltip: {enabled: false}},
      scales: assi(c, {x: {type: "linear", min: xs[0], max: xs[xs.length - 1], ticks: {callback: v => prezzo(v)},

        y: {beginAtZero: true, ticks: {display: false}, grid: {display: false}}})}});
}

function graficiGrappoli(a, st) {
  if (Chart.getChart(document.getElementById("gGrappoli"))) return;      /* già disegnati */
  const c = colori(), n = st.c.length, usaG = !!(st.zg && st.sg);
  const sig = usaG ? st.sg : st.se;
  /* rendimento della seduta t e σ prevista per t la sera prima (sig[t-1]) */
  const r = [], sd = [], date = [];
  for (let t = 1; t < n; t++) { r.push(Math.log(st.c[t] / st.c[t - 1]) * 100); sd.push(sig[t - 1]); date.push(st.date[t]); }
  const f = stato.grappoli || "1", quante = f === "tutto" ? r.length : Math.min(r.length, Number(f) * SEDUTE_ANNO);
  const i0 = r.length - quante, R = r.slice(i0), SD = sd.slice(i0), D = date.slice(i0);
  const fuori = R.map((x, i) => SD[i] != null && Math.abs(x) > 2 * SD[i]);
  const anniTick = (v, i) => { const d = D[i]; if (!d || i === 0 || D[i - 1].slice(0, 4) === d.slice(0, 4)) return "";
    const y = Number(d.slice(0, 4)), passo = quante > 2600 ? 5 : quante > 800 ? 1 : 0;
    return passo === 0 ? "" : y % passo === 0 ? d.slice(0, 4) : ""; };
  nuovoGrafico("gGrappoli", {data: {labels: D, datasets: [
      {type: "bar", data: R, backgroundColor: fuori.map(x => x ? c.neg : alfa(c.text2, 0.55)), barPercentage: 1, categoryPercentage: 1, order: 2},
      {type: "line", data: SD.map(x => x == null ? null : 2 * x), borderColor: c.s1, borderWidth: 1.2, pointRadius: 0, order: 1},
      {type: "line", data: SD.map(x => x == null ? null : -2 * x), borderColor: c.s1, borderWidth: 1.2, pointRadius: 0, order: 1}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex === 0, callbacks: {title: it => dataBreve(it[0].label),
        label: it => { const i = it.dataIndex; return [`rendimento ${conSegno(R[i], 2)}%`, `fascia ±${nf(2 * SD[i], 2)}%`, `z ${conSegno(R[i] / SD[i], 2)}`]; }}}},
      scales: assi(c, {x: {ticks: {autoSkip: false, maxRotation: 0, callback: quante <= 300 ? tickMese(D) : anniTick}},
        y: {ticks: {maxTicksLimit: 6, callback: v => conSegno(v, 0) + "%"}}})}});

  /* autocorrelazione su tutta la storia */
  const L = 60, ar = autocorrelazione(r, L), aa = autocorrelazione(r.map(Math.abs), L), banda = 2 / Math.sqrt(r.length);
  const lag = Array.from({length: L}, (_, i) => i + 1);
  nuovoGrafico("gAcf", {data: {labels: lag, datasets: [
      {type: "line", data: lag.map(() => banda), borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: alfa(c.text2, 0.18), order: 3},
      {type: "line", data: lag.map(() => -banda), borderWidth: 0, pointRadius: 0, order: 3},
      {type: "bar", label: "Ampiezza", data: aa, backgroundColor: c.s1, barPercentage: 0.9, categoryPercentage: 0.9, order: 1},
      {type: "bar", label: "Direzione", data: ar, backgroundColor: c.s2, barPercentage: 0.9, categoryPercentage: 0.9, order: 2}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex >= 2, callbacks: {title: it => `Ritardo ${it[0].label} ${it[0].label === "1" ? "seduta" : "sedute"}`,
        label: it => `${it.dataset.label}: ${conSegno(it.raw, 3)}`}}},
      scales: assi(c, {x: {ticks: {autoSkip: false, maxRotation: 0, callback: (v, i) => (i + 1) % 10 === 0 || i === 0 ? String(i + 1) : ""}},
        y: {ticks: {maxTicksLimit: 5, callback: v => nf(v, 2)}}})}});

  /* lettura */
  let memoria = 0;
  while (memoria < L && aa[memoria] > banda) memoria++;
  const dirFuori = lag.filter((_, i) => Math.abs(ar[i]) > banda);
  /* raggruppamento grezzo, senza modello: sedute oltre due deviazioni standard di tutta la storia;
     dopo una di queste, quante volte ne arriva un'altra entro 5 sedute, contro la frequenza se fossero sparse a caso */
  const m0 = r.reduce((x, y) => x + y, 0) / r.length, dev = Math.sqrt(r.reduce((x, y) => x + (y - m0) ** 2, 0) / (r.length - 1));
  const grande = r.map(x => Math.abs(x - m0) > 2 * dev), quotaGrandi = grande.filter(Boolean).length / r.length;
  let dopo = 0, casi = 0;
  for (let i = 0; i < grande.length - 5; i++) if (grande[i]) { casi++; if (grande.slice(i + 1, i + 6).some(Boolean)) dopo++; }
  const attesa = 1 - Math.pow(1 - quotaGrandi, 5);
  const g = a.garch;
  const el = document.getElementById("grappoli-testo");
  if (!el) return;
  const ampiezza = memoria >= 5 ? `L'ampiezza ha memoria per ${memoria === L ? `almeno ${L}` : `circa ${memoria}`} sedute` : "L'ampiezza ha poca memoria";
  const direzione = dirFuori.length <= Math.round(L * 0.05) ? "la direzione no" : `la direzione quasi nulla${ar[0] < -banda ? ", con un lieve rientro il giorno dopo" : ""}`;
  el.innerHTML = `<dl class="kv">
      ${riga("Ampiezza a 1, 20 e 60 sedute", `${nf(aa[0], 2)} / ${nf(aa[19], 2)} / ${nf(aa[59], 2)}`)}
      ${riga("Ampiezza fuori dal rumore", memoria === L ? `tutti i ${L} ritardi` : `i primi ${memoria} ritardi`)}
      ${riga("Direzione a 1 seduta", conSegno(ar[0], 3) + (Math.abs(ar[0]) > banda ? "" : " (rumore)"))}
      ${riga("Direzione fuori dal rumore", `${dirFuori.length} ritardi su ${L} <span class="piccolo">(per caso ${Math.round(L * 0.05)})</span>`)}
      ${g && g.emivita ? riga("Emivita di uno shock (GARCH)", nf(g.emivita, 0) + " sedute") : ""}
      ${casi >= 10 ? riga(`Dopo una seduta oltre ${nf(2 * dev, 1)}%, un'altra entro 5`, `${pctNoSegno(dopo / casi, 0)} <span class="piccolo">(${pctNoSegno(attesa, 0)} a caso)</span>`) : ""}
    </dl>
    <div class="regola">${ampiezza}, ${direzione}: volatilità a grappoli non vuol dire trend.</div>`;
}

function graficoCurva(a, c) {
  const cv = a.curva;
  if (!cv) return;

    <h3 style="margin-top:14px;font-size:14px">Le code</h3>
    <table><thead><tr><th rowspan="2" style="vertical-align:bottom">Soglia</th><th colspan="3" style="text-align:center;border-bottom:0;padding-bottom:0">Una seduta ogni…</th><th rowspan="2" style="vertical-align:bottom">Volte</th></tr>
      <tr><th>osservata</th><th>t</th><th>gaussiana</th></tr></thead>
      <tbody>${righe.join("")}</tbody></table>
    <dl class="kv" style="margin-top:12px">
      <dt>Indice di coda α (Hill), ribassi</dt><dd>${h("sinistra")}</dd>
      <dt>Indice di coda α (Hill), rialzi</dt><dd>${h("destra")}</dd>

      <dt>VaR storico 1%, un giorno</dt><dd>${pctNoSegno(dist.var1)}</dd>

    </dl>
    ${sottoQuattro.length ? `<div class="avviso">α sotto 4 sulla coda dei ${sottoQuattro.map(l => l === "sinistra" ? "ribassi" : "rialzi").join(" e dei ")}: il momento quarto non è finito e, secondo Taleb, la varianza stimata dal campione è instabile. La curtosi qui sopra è solo indicativa.</div>` : ""}
    <p class="piccolo" style="margin-top:8px">Il giorno più estremo del campione (${dataBreve(ms.data)}, ${pct(ms.rendimento)}) da solo vale il ${pctNoSegno(ms.quota, 0)} della somma dei rendimenti alla quarta, cioè della curtosi.</p>

function graficoDistribuzione(a, c) {
  const dist = a.distribuzione, modo = dist.garch ? stato.modo : "grezzi";
  const blocco = dist[modo], n = modo === "grezzi" ? dist.n : dist.garch.n;
  const bordi = stato.dati.bordi, larg = bordi[1] - bordi[0], log = stato.scala === "log";
  const barre = blocco.conteggi.map((k, i) => ({x: (bordi[i] + bordi[i + 1]) / 2, y: k ? k / (n * larg) : (log ? null : 0), k}));
  const lim = log ? 8 : 5, gauss = [], tt = [];
  let pdfT;
  if (modo === "grezzi") { const t = dist.grezzi.t; pdfT = x => tPdf((x - t.loc) / t.scala, t.df) / t.scala; }
  else { pdfT = x => tStdPdf(x, dist.garch.nu); }
  for (let i = 0; i <= 320; i++) {
    const x = -lim + i * 2 * lim / 320;
    gauss.push({x, y: normPdf(x)});
    tt.push({x, y: pdfT(x)});
  }
  const ymin = 1e-5;
  const fmtLog = v => {
    const e = Math.round(Math.log10(v));
    if (Math.abs(Math.log10(v) - e) > 1e-9) return "";
    return e >= -2 ? nf(v, Math.max(0, -e)) : "10" + String(e).replace("-", "⁻").replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  };
  nuovoGrafico("gDist", {data: {datasets: [
      {type: "bar", label: "Osservati", data: barre, backgroundColor: alfa(c.s1, 0.55), barPercentage: 1, categoryPercentage: 0.88, borderRadius: 0},
      {type: "line", label: "Gaussiana", data: gauss, borderColor: c.text2, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0},
      {type: "line", label: "t di Student", data: tt, borderColor: c.s2, borderWidth: 2, pointRadius: 0},
    ]},
    options: {parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex === 0, callbacks: {
        title: it => { const x = it[0].raw.x; return `Tra ${conSegno(x - larg / 2, 2)} e ${conSegno(x + larg / 2, 2)}σ`; },
        label: it => `${nf(it.raw.k, 0)} sedute, ${pctNoSegno(it.raw.k / n, it.raw.k / n < 0.001 ? 3 : 2)}`}}},
      scales: assi(c, {x: {type: "linear", min: -lim, max: lim, ticks: {stepSize: 2, callback: v => v === 0 ? "0" : conSegno(v, 0) + "σ"}},
        y: log ? {type: "logarithmic", min: ymin, max: 1, ticks: {callback: fmtLog, autoSkip: false},
                  grid: {color: ctx => ctx.tick && potenzaDi10(ctx.tick.value) ? c.grid : "transparent", drawTicks: false}}
               : {beginAtZero: true, ticks: {maxTicksLimit: 5, callback: v => nf(v, 1)}}})}});
}

function diagnosiVolatilita(st, p, ops) {
  const el = document.getElementById("lab-volreg"), g = stato.labGrafici, sint = document.getElementById("s-volreg");
  if (!el || !g || !g.VolReg) return;
  const usaG = p.sigma === "garch" && !!st.zg, v = perVolatilita(ops, st, usaG);
  if (!v) { el.innerHTML = `<p class="piccolo">Storia troppo corta per dividere la volatilità in tre parti.</p>`; sint.textContent = ""; return; }
  const k3 = ["bassa", "media", "alta"], gr = v.gruppi, c = g.colori;
  g.VolReg.$gruppi = gr;
  g.VolReg.data.datasets[0].data = k3.map(k => gr[k].n ? gr[k].media : null);
  g.VolReg.data.datasets[0].backgroundColor = k3.map(k => gr[k].media >= 0 ? c.s1 : c.neg);
  g.VolReg.update("none");
  const cella = d => d.n ? `${conSegno(d.media, 2)}R` : "–", tCella = d => d.n > 1 ? conSegno(d.t, 1) : "–";
  const a = gr.alta, b = gr.bassa, MIN = 10, tot = a.n + gr.media.n + b.n;
  let verdetto, breve;
  if (a.n < MIN || b.n < MIN) {
    verdetto = "Operazioni insufficienti per confrontare volatilità alta e bassa.";
    breve = "operazioni insufficienti";
  } else {
    /* una differenza conta solo se supera due volte il suo errore standard */
    const d = a.media - b.media, es = Math.sqrt(a.es ** 2 + b.es ** 2), rumore = Math.abs(d) <= 2 * es;
    verdetto = rumore ? `Tra volatilità alta e bassa la differenza (${conSegno(d, 2)}R) sta dentro il rumore (±${nf(2 * es, 2)}R).`
      : `Con volatilità alta la regola fa ${d > 0 ? "meglio" : "peggio"} che con volatilità bassa: ${conSegno(d, 2)}R, oltre due errori standard.`;
    breve = rumore ? "tra alta e bassa la differenza è nel rumore" : `con volatilità alta va ${d > 0 ? "meglio" : "peggio"}`;
  }
  sint.textContent = breve;
  el.innerHTML = `<table style="margin-top:8px"><thead><tr><th>Volatilità all'ingresso</th><th>Operazioni</th><th>R medio</th><th>t</th></tr></thead><tbody>
      <tr><td>Bassa, sotto ${nf(v.soglie[0], 2)} volte la mediana</td><td>${b.n}</td><td>${cella(b)}</td><td>${tCella(b)}</td></tr>
      <tr><td>Media</td><td>${gr.media.n}</td><td>${cella(gr.media)}</td><td>${tCella(gr.media)}</td></tr>
      <tr><td>Alta, sopra ${nf(v.soglie[1], 2)} volte la mediana</td><td>${a.n}</td><td>${cella(a)}</td><td>${tCella(a)}</td></tr>
    </tbody></table>
    <p class="piccolo" style="margin-top:6px">${tot ? `Ingressi nel terzo più volatile: ${pctNoSegno(a.n / tot, 0)}. ` : ""}Oggi la σ è ${v.oggi != null ? nf(v.oggi, 2) : "–"} volte la mediana dell'ultimo anno: volatilità ${v.regimeOggi || "–"}.</p>
    <div class="regola">${verdetto}</div>`;
}

function diagnosiFasi(st, p) {
  const g = stato.labGrafici, el = document.getElementById("lab-fasi");
  if (!el || !g || !g.Fasi) return;
  const base = {...p, fase: "tutte", dirTrend: "tutte"};
  const dc = perFase(simulaStrategia(st, {...base, strategia: "contrarian"}).ops);
  const dt = perFase(simulaStrategia(st, {...base, strategia: "trend"}).ops);
  const MIN = 10, fasi = ["laterale", "intermedia", "trend"], nomi = nomiFase(p);
  g.Fasi.data.labels = fasi.map(k => nomi[k]);
  g.Fasi.$n = [dc, dt];
  g.Fasi.data.datasets[0].data = fasi.map(k => dc[k].media);
  g.Fasi.data.datasets[1].data = fasi.map(k => dt[k].media);
  g.Fasi.update("none");
  const cella = d => d.n ? `${conSegno(d.media, 2)}R <span class="piccolo">(${d.n})</span>` : "–";
  /* una differenza conta solo se supera due volte il suo errore standard */
  const meglio = k => {
    const a = dc[k], b = dt[k];
    if (a.n < MIN || b.n < MIN) return {ok: false, vince: null, testo: "poche operazioni"};
    const d = a.media - b.media, es = Math.sqrt(a.es ** 2 + b.es ** 2);
    if (Math.abs(d) <= 2 * es) return {ok: true, vince: null, testo: "nel rumore"};
    return {ok: true, vince: d > 0 ? "contrarian" : "trend", testo: d > 0 ? "contrarian" : "trend"};
  };
  const righe = [...fasi.map(k => [nomi[k], k]), ["A favore del trend", "favore"], ["Contro il trend", "contro"]];
  const esiti = Object.fromEntries(righe.map(([, k]) => [k, meglio(k)]));
  const abbastanza = esiti.laterale.ok && esiti.trend.ok;
  const separa = esiti.laterale.vince === "contrarian" && esiti.trend.vince === "trend";
  const misura = p.indicatore === "autocorrelazione" ? "l'autocorrelazione" : "la forza del trend";
  document.getElementById("s-fasi").textContent = !abbastanza ? "operazioni insufficienti"
    : separa ? "la fase separa contrarian e trend" : "la fase non separa contrarian e trend";
  el.innerHTML = `<table style="margin-top:8px"><thead><tr><th>Fase all'ingresso</th><th>Contrarian</th><th>Trend</th><th>Meglio</th></tr></thead><tbody>
      ${righe.map(([nome, k]) => `<tr><td>${nome}</td><td>${cella(dc[k])}</td><td>${cella(dt[k])}</td><td>${esiti[k].testo}</td></tr>`).join("")}
    </tbody></table>
    <p class="piccolo" style="margin-top:6px">Tra parentesi il numero di operazioni. A favore: nello stesso verso del prezzo nelle ultime ${p.N} sedute.</p>
    <div class="regola">${!abbastanza ? "Operazioni insufficienti per confrontare le fasi."
      : separa ? `Qui ${misura} separa le due strategie: contrarian nella prima fase, trend nella terza. Da verificare sulle due metà del periodo.`
      : `Qui ${misura} non separa le due strategie in modo affidabile.`}</div>`;
}

        ${CURSORI_FASE.map(c => rigaCursore(c, p)).join("")}
        <div class="controlli">
          ${p.strategia === "combinata" ? "" : seg("fase", [["tutte", "Tutte"], ...["laterale", "intermedia", "trend"].map(k => [k, nomi[k]])], "Fase")}
          ${seg("dirTrend", [["tutte", "Ogni direzione"], ["favore", "A favore del trend"], ["contro", "Contro"]], "Direzione rispetto al trend")}
        </div>
        ${comeSiLegge("fasi")}`)}
    </div>
    <div id="sch-risultati"${sch === "risultati" ? "" : " hidden"}>
      <section class="card">
        <p class="nota" id="lab-periodo"></p>
        <div class="tiles" id="lab-tiles"></div>
        <h3 style="font-size:14px;margin-top:4px">Distribuzione dei risultati, in R</h3>
        <div class="legenda"><span><i class="q" style="background:var(--s1)"></i>Guadagni</span><span><i class="q" style="background:var(--neg)"></i>Perdite</span>
          <span><i class="lin tr" style="border-color:var(--text)"></i>Media</span></div>
        <div class="grafico" style="height:200px"><canvas id="gR" role="img" aria-label="Istogramma dei risultati delle operazioni in R"></canvas></div>
        ${sotto("Risultato cumulato, in R")}
        <div class="grafico" style="height:170px;margin-top:6px"><canvas id="gEq" role="img" aria-label="Somma dei risultati in R operazione dopo operazione"></canvas></div>
        ${comeSiLegge("risultati")}
      </section>
      ${piega("lab-ops", "Ultime operazioni", "", `<div id="lab-ops"></div>`, "s-ops")}
      ${piega("lab-fasi", "Per fase di mercato", "", `
        <div class="legenda"><span><i class="q" style="background:var(--s2)"></i>Contrarian</span><span><i class="q" style="background:var(--s1)"></i>Trend following</span></div>
        <div class="grafico" style="height:190px"><canvas id="gFasi" role="img" aria-label="Risultato medio di contrarian e trend following in ogni fase di mercato"></canvas></div>
        <div id="lab-fasi"></div>${comeSiLegge("fasi")}`, "s-fasi")}
      ${piega("lab-volreg", "Per volatilità all'ingresso", "", `
        <div class="grafico" style="height:170px"><canvas id="gVolReg" role="img" aria-label="Risultato medio per regime di volatilità all'ingresso"></canvas></div>
        <div id="lab-volreg"></div>${comeSiLegge("volreg")}`, "s-volreg")}
      ${piega("lab-mc", "Prossime 200 operazioni", "", `
        <p class="piccolo" id="lab-mc-nota"></p>
        <div class="legenda"><span><i class="lin" style="border-color:var(--s1)"></i>Mediana</span>
          <span><i class="q" style="background:var(--s1);opacity:.35"></i>50% centrale</span>
          <span><i class="q" style="background:var(--s1);opacity:.15"></i>90% centrale</span></div>
        <div class="grafico" style="height:200px"><canvas id="gFan" role="img" aria-label="Ventaglio del capitale in 200 operazioni simulate"></canvas></div>
        ${sotto("Capitale dopo 200 operazioni")}
        <div class="grafico" style="height:180px;margin-top:6px"><canvas id="gFin" role="img" aria-label="Distribuzione del capitale finale nelle simulazioni"></canvas></div>
        <dl class="kv" id="lab-mc"></dl>${comeSiLegge("montecarlo")}`, "s-mc")}
    </div>
    <div id="sch-oggi"${sch === "oggi" ? "" : " hidden"}>
      <section class="card">
        <div id="lab-oggi"></div>
        ${sotto("Capitale e rischio")}
        ${CURSORI_OGGI.map(c => rigaCursore(c, p)).join("")}
        ${comeSiLegge("oggi")}
      </section>
    </div>`;
  attivaPieghe();
  let st;
  try { st = await caricaStoria(a); }
  catch (e) {
    const el = document.getElementById("lab-avvisi");
    if (el) el.innerHTML = `<div class="errore">Storico di questo mercato non disponibile (${esc(e.message)}).</div>`;
    return;
  }
  if (stato.labAsset !== a || !document.getElementById("gR")) return;       /* nel frattempo è cambiata pagina */
  stato.labStoria = st;
  creaGraficiLab();
  ricalcolaLab();
}
/* cambia scheda senza ridisegnare la pagina: i cursori restano dove sono */
function schedaLab(k) {
  stato.labScheda = k;
  for (const x of ["regola", "risultati", "oggi"]) {
    document.getElementById("sch-" + x).hidden = x !== k;
    document.getElementById("tab-" + x).setAttribute("aria-pressed", String(x === k));
  }
  ridimensiona(document.getElementById("sch-" + k));
  window.scrollTo(0, 0);
}
function seguiRegola() {
  stato.seguita = {sim: stato.labSim, p: {...stato.lab, periodo: "tutto"}};
  ricorda();
  aggiornaSegui();
}
function aggiornaSegui() {
  const b = document.getElementById("lab-segui");
  if (!b) return;
  const uguale = stato.seguita.sim === stato.labSim && CHIAVI_REGOLA.every(k => stato.seguita.p[k] === stato.lab[k]);
  b.textContent = uguale ? "Regola seguita in «Oggi»" : "Segui questa regola in «Oggi»";
  b.disabled = uguale;
}

function creaGraficiLab() {
  if (Chart.getChart(document.getElementById("gR"))) return;              /* già creati */
  const c = impostaChart();
  const g = {};
  g.R = nuovoGrafico("gR", {data: {datasets: [
      {type: "bar", data: [], backgroundColor: [], barPercentage: 1, categoryPercentage: 0.88},
      {type: "line", data: [], borderColor: c.text, borderDash: [4, 3], borderWidth: 1.5, pointRadius: 0}]},
    options: {parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex === 0, callbacks: {
        title: it => `Tra ${conSegno(it[0].raw.da, 2)} e ${conSegno(it[0].raw.a, 2)}R`,
        label: it => `${nf(it.raw.y, 0)} operazioni`}}},
      scales: assi(c, {x: {type: "linear", ticks: {maxTicksLimit: 7, callback: v => conSegno(v, 0) + "R"}},
        y: {beginAtZero: true, ticks: {maxTicksLimit: 5, precision: 0}}})}});
  g.Eq = nuovoGrafico("gEq", {type: "line", data: {labels: [], datasets: [
      {data: [], borderColor: c.s1, borderWidth: 2, pointRadius: 0}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {callbacks: {title: it => it[0].label, label: it => `cumulato ${conSegno(it.raw, 1)}R`}}},
      scales: assi(c, {x: {ticks: {maxTicksLimit: 4, maxRotation: 0, callback: function (v) { const l = this.getLabelForValue(v); return l ? l.slice(-4) : ""; }}},
        y: {ticks: {maxTicksLimit: 5, callback: v => conSegno(v, 0) + "R"}}})}});
  const banda = (alfaF, riemp) => ({data: [], borderWidth: 0, pointRadius: 0, fill: riemp, backgroundColor: alfa(c.s1, alfaF)});
  g.Fan = nuovoGrafico("gFan", {type: "line", data: {labels: Array.from({length: 201}, (_, i) => i), datasets: [
      banda(0, false), banda(0.15, "-1"), banda(0, false), banda(0.35, "-1"),
      {data: [], borderColor: c.s1, borderWidth: 2, pointRadius: 0},
      {data: Array(201).fill(100), borderColor: c.text2, borderDash: [4, 4], borderWidth: 1, pointRadius: 0}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {filter: it => it.datasetIndex === 4, callbacks: {title: it => `Dopo ${it[0].label} operazioni`,
        label: it => { const b = g.Fan.$bande, i = it.dataIndex; return [`mediana ${nf(b.p50[i] - 100, 1)}%`, `90% tra ${nf(b.p5[i] - 100, 1)}% e ${nf(b.p95[i] - 100, 1)}%`]; }}}},
      scales: assi(c, {x: {title: {display: true, text: "operazioni", color: c.muted, font: {size: 11}}, ticks: {autoSkip: false, maxRotation: 0, callback: v => v % 50 === 0 ? String(v) : ""}},
        y: {ticks: {maxTicksLimit: 6, callback: v => conSegno(v - 100, 0) + "%"}}})}});
  g.Fin = nuovoGrafico("gFin", {data: {datasets: [
      {type: "bar", data: [], backgroundColor: [], barPercentage: 1, categoryPercentage: 0.88}]},
    options: {parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
      plugins: {tooltip: {callbacks: {title: it => `Tra ${conSegno(it[0].raw.da, 0)}% e ${conSegno(it[0].raw.a, 0)}%`,
        label: it => `${pctNoSegno(it.raw.y / 4000, 1)} delle simulazioni`}}},
      scales: assi(c, {x: {type: "linear", ticks: {maxTicksLimit: 6, callback: v => conSegno(v, 0) + "%"}},
        y: {beginAtZero: true, ticks: {display: false}, grid: {display: false}}})}});
  g.Fasi = nuovoGrafico("gFasi", {type: "bar", data: {labels: ["Laterale", "Intermedia", "Trend"], datasets: [
      {label: "Contrarian", data: [], backgroundColor: c.s2, barPercentage: 0.9, categoryPercentage: 0.7},
      {label: "Trend following", data: [], backgroundColor: c.s1, barPercentage: 0.9, categoryPercentage: 0.7}]},
    options: {interaction: {mode: "index", intersect: false},
      plugins: {tooltip: {callbacks: {title: it => it[0].label, label: it => {
        const d = g.Fasi.$n[it.datasetIndex][["laterale", "intermedia", "trend"][it.dataIndex]];
        return d.n ? `${it.dataset.label}: ${conSegno(d.media, 2)}R su ${d.n} operazioni` : `${it.dataset.label}: nessuna operazione`; }}}},
      scales: assi(c, {y: {ticks: {maxTicksLimit: 5, callback: v => conSegno(v, 2) + "R"}}})}});
  g.VolReg = nuovoGrafico("gVolReg", {type: "bar", data: {labels: ["Bassa", "Media", "Alta"], datasets: [
      {data: [], backgroundColor: [], barPercentage: 0.8, categoryPercentage: 0.8}]},
    options: {plugins: {tooltip: {callbacks: {title: it => `Volatilità ${it[0].label.toLowerCase()}`, label: it => {
        const d = g.VolReg.$gruppi[["bassa", "media", "alta"][it.dataIndex]];
        return d.n ? `${conSegno(d.media, 2)}R su ${d.n} operazioni` : "nessuna operazione"; }}}},
      scales: assi(c, {y: {ticks: {maxTicksLimit: 5, callback: v => conSegno(v, 2) + "R"}}})}});
  g.colori = c;
  stato.labGrafici = g;
}

function ricalcolaLab() {
  const st = stato.labStoria, g = stato.labGrafici, p = stato.lab;
  if (!st || !g || !document.getElementById("gR")) return;
  const c = g.colori;
  document.getElementById("lab-regola").textContent = descriviRegole(p, !!(stato.labAsset && stato.labAsset.rettifica));
  const ris = simulaStrategia(st, p), {ops, i0, i1, anni} = ris;
  document.getElementById("lab-oggi").innerHTML = htmlSegnale(stato.labAsset, st, p, false);
  const s = statisticheOps(ops, anni);
  document.getElementById("lab-esito").innerHTML = s
    ? `<span><b>${nf(s.n, 0)}</b> operazioni</span><span><b>${conSegno(s.media, 2)}R</b> in media</span><span>t <b>${conSegno(s.t, 1)}</b></span><span><b>${pctNoSegno(s.vincenti, 0)}</b> in guadagno</span>`
    : "Nessuna operazione con queste regole";
  aggiornaSegui();
  ricorda();
  diagnosiFasi(st, p);
  diagnosiVolatilita(st, p, ops);
  document.getElementById("lab-periodo").textContent =
    `Dal ${dataBreve(st.date[i0])} al ${dataBreve(st.date[i1])}, ${nf(i1 - i0 + 1, 0)} sedute.`;
  const avvisi = [];
  if (!s) avvisi.push(`<div class="avviso">Nessuna operazione con queste regole: soglia di ingresso troppo alta o filtri troppo stretti.</div>`);
  else if (s.n < 30) avvisi.push(`<div class="avviso">Solo ${s.n} operazioni: troppo poche per giudicare.</div>`);
  document.getElementById("lab-avvisi").innerHTML = avvisi.join("");
  const tile = (l, v, sub) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  if (!s) {
    document.getElementById("lab-tiles").innerHTML = "";
    document.getElementById("lab-ops").innerHTML = "";
    document.getElementById("lab-mc").innerHTML = "";
    document.getElementById("lab-mc-nota").textContent = "";
    ["s-ops", "s-mc"].forEach(id => { document.getElementById(id).textContent = ""; });
    [g.R, g.Eq, g.Fan, g.Fin].forEach(ch => { ch.data.datasets.forEach((d, i) => { if (!(ch === g.Fan && i === 5)) d.data = []; }); ch.update("none"); });
    return;
  }
  document.getElementById("lab-tiles").innerHTML =
    tile("Operazioni", nf(s.n, 0), s.perAnno != null ? `${nf(s.perAnno, 1)} l'anno` : "") +
    tile("Vincenti", pctNoSegno(s.vincenti, 0), `media ${conSegno(s.mediaV, 2)}R / ${conSegno(s.mediaP, 2)}R`) +
    tile("Media per operazione", conSegno(s.media, 2) + "R", `${pct(s.mediaPct)} del prezzo`) +
    tile("Profit factor", isFinite(s.pf) ? nf(s.pf, 2) : "–", "guadagni / perdite") +
    tile("Peggiore / migliore", `${conSegno(s.peggiore, 1)}R`, `migliore ${conSegno(s.migliore, 1)}R`) +
    tile("Asimmetria", s.skew != null ? conSegno(s.skew, 2) : "–", s.skew == null ? "" : s.skew < 0 ? "profilo concavo" : "profilo convesso") +
    tile("Durata media", nf(s.durata, 1) + " sedute") +
    tile("Discesa massima", `${conSegno(-s.ddR, 1)}R`, "sul cumulato storico");
  /* istogramma dei risultati */
  const R = ops.map(o => o.R), bin = classi(R, [0.1, 0.2, 0.25, 0.5, 1, 2, 5]);
  g.R.data.datasets[0].data = bin;
  g.R.data.datasets[0].backgroundColor = bin.map(b => alfa(b.x >= 0 ? c.s1 : c.neg, 0.85));
  g.R.data.datasets[1].data = [{x: s.media, y: 0}, {x: s.media, y: Math.max(...bin.map(b => b.y)) * 1.08}];
  g.R.update("none");
  /* cumulato */
  g.Eq.data.labels = ops.map(o => dataBreve(st.date[o.iu]));
  g.Eq.data.datasets[0].data = s.curva;
  g.Eq.update("none");
  /* Monte Carlo */
  const f = p.rischio / 100, mc = montecarlo(R, f), b = mc.bande;
  g.Fan.$bande = b;
  [b.p5, b.p95, b.p25, b.p75, b.p50].forEach((serie, i) => { g.Fan.data.datasets[i].data = serie; });
  g.Fan.update("none");
  const fin = Array.from(mc.finali, e => (e - 1) * 100), binF = classi(fin, [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000, 5000]);
  g.Fin.data.datasets[0].data = binF;
  g.Fin.data.datasets[0].backgroundColor = binF.map(x => alfa(x.x >= 0 ? c.s1 : c.neg, 0.85));
  g.Fin.update("none");
  const anniMc = s.perAnno ? 200 / s.perAnno : null;
  document.getElementById("lab-mc-nota").textContent =
    `4.000 percorsi da 200 operazioni, rischio ${nf(p.rischio, 2)}% del capitale per operazione.` +
    (anniMc ? ` Al ritmo storico sono circa ${nf(anniMc, anniMc < 10 ? 1 : 0)} anni.` : "");
  document.getElementById("s-mc").textContent =
    `capitale finale: mediana ${pct(quantile(mc.finali, 0.5) - 1, 0)}, 5% peggiore ${pct(quantile(mc.finali, 0.05) - 1, 0)}`;
  const qf = q => pct(quantile(mc.finali, q) - 1, 0), qd = q => pctNoSegno(quantile(mc.dd, q), 0);
  document.getElementById("lab-mc").innerHTML = `
    <dt>Capitale finale, 5% peggiore</dt><dd>${qf(0.05)}</dd>
    <dt>Capitale finale, mediana</dt><dd>${qf(0.5)}</dd>
    <dt>Capitale finale, 5% migliore</dt><dd>${qf(0.95)}</dd>
    <dt>Probabilità di chiudere in perdita</dt><dd>${pctNoSegno(mc.pPerdita, 0)}</dd>
    <dt>Discesa massima, mediana</dt><dd>${qd(0.5)}</dd>
    <dt>Discesa massima, 5% peggiore</dt><dd>${qd(0.95)}</dd>
    <dt>Probabilità di perdere metà del capitale</dt><dd>${pctNoSegno(mc.pMeta, 1)}</dd>`;
  /* ultime operazioni */
  const ultime = ops.slice(-30).reverse();
  document.getElementById("lab-ops").innerHTML = `<table><thead><tr><th>Ingresso</th><th>Lato</th><th>Sedute</th><th>R</th><th>Uscita</th></tr></thead><tbody>${
    ultime.map(o => `<tr><td>${dataBreve(st.date[o.ie])}</td><td>${o.lato === 1 ? "long" : "short"}</td><td>${o.durata}</td>
      <td>${conSegno(o.R, 2)}</td><td>${o.motivo}</td></tr>`).join("")}</tbody></table>`;
  document.getElementById("s-ops").textContent = ultime.length
    ? `l'ultima: ${dataBreve(st.date[ultime[0].ie])}, ${conSegno(ultime[0].R, 2)}R` : "";
}

/* ---------- navigazione ---------- */
function rotta() {
  if (!stato.dati) return;
  const h = decodeURIComponent(location.hash.slice(1));
  distruggi();
  let voce = "oggi";
  if (h.startsWith("m=")) { voce = "mercati"; dettaglio(h.slice(2)); }
  else if (h === "mercati") { voce = "mercati"; paginaMercati(); }
  else if (h.startsWith("lab=")) { voce = "strategia"; laboratorio(h.slice(4)); }
  else if (h === "strategia") { voce = "strategia"; laboratorio(stato.labSim); }
  else paginaOggi();
  for (const k of ["oggi", "mercati", "strategia"]) {
    const el = document.getElementById("nav-" + k);
    if (k === voce) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
  }
}
window.addEventListener("hashchange", () => {
  const h = location.hash;
  rotta();
  window.scrollTo(0, h === "#mercati" ? stato.scrollElenco : 0);
});
function apri(sim) {
  if (location.hash === "#mercati") stato.scrollElenco = window.scrollY;
  location.hash = "m=" + encodeURIComponent(sim);
}
function indietro() { if (history.length > 1) history.back(); else location.hash = "mercati"; }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => rotta());

if ("serviceWorker" in navigator) navigator.serviceWorker.register(BASE + "sw.js").catch(() => {});
avvia();
</script>
